          - generic [ref=e102]:
            - generic [ref=e105]:
              - paragraph [ref=e106]:
                - text: Health care leaders are under continued pressure to reduce operational costs, stabilize a strained workforce, and improve access and experience.
                - superscript [ref=e107]:
                  - link "Endnotes reference number 1" [ref=e108] [cursor=pointer]:
                    - /url: "#endnote-1"
                    - text: "1"
                - text: While artificial intelligence has the potential to be transformative, many organizations report incremental gains, often slowed by organizational and implementation hurdles rather than a lack of use cases.
                - superscript [ref=e109]:
                  - link "Endnotes reference number 2" [ref=e110] [cursor=pointer]:
                    - /url: "#endnote-2"
                    - text: "2"
                - text: That dynamic is beginning to shift with agentic AI. Unlike traditional and generative AI, which primarily respond to prompts or support discrete decisions, agentic AI can plan and sequence tasks, adapt to conditions, and coordinate with people and platforms to help deliver outcomes across clinical, administrative, and financial domains. When designed responsibly, these agents operate with explicit guardrails and under human oversight.
              - paragraph [ref=e111]:
                - text: To understand how agentic AI is showing up in the market, the Deloitte Center for Health Solutions surveyed 100 US health care technology executives (50 from health systems and 50 from health plans) in September 2025 and conducted online focus groups with 35 health care technology executives, futurists, technologists, and agentic AI leaders (see
                - link "methodology" [ref=e112] [cursor=pointer]:
                  - /url: "#methodology"
                - text: "). The findings suggest that long-standing AI adoption challenges—constraints that are likely shaping early agentic AI scaling—are beginning to ease: 40% of surveyed leaders say technical talent limitations are no longer a major challenge. Leaders also reported reduced friction from resistance to change (38%), leadership buy-in (35%), and data quality concerns (32%) (figure 1)."
            - paragraph [ref=e116]: Together, these signals suggest that agentic AI is moving beyond experimentation. For executives, the focus should shift from adoption to scale, and from pilots to real operational impact. That means scaling agentic AI responsibly to unlock measurable improvements in consumer engagement, care delivery, workforce capacity, and core administrative and payment workflows.
        - generic [ref=e120]:
          - generic [ref=e126]:
            - generic [ref=e128]:
              - link "Download" [ref=e129] [cursor=pointer]:
                - /url: /content/dam/insights/articles/2026/us188461_chs-agentic-ai-in-health-care/content-images/US188461_Figure1.png
                - generic [ref=e130]: 
              - link "Share infographic" [ref=e131] [cursor=pointer]:
                - /url: "#"
                - generic [ref=e132]: 
            - text:     
          - paragraph [ref=e138]:
            - text: "As hurdles ease, many organizations are responding with a stronger commitment to agentic AI adoption (figure 2) and more effectively managing what they have already built. Sixty-one percent of respondents say they are already building and implementing agentic AI initiatives or have secured budgets, and 85% plan to increase investment over the next two to three years. Increased investment comes with higher expectations for return: 98% of surveyed executives expect at least 10% cost savings in that timeframe, with 37% expecting savings above 20%. Together, these responses suggest many leaders likely view agentic AI as a strategic lever for performance, growth, and workforce sustainability. Deloitte’s"
            - link "2026 US Health Care Outlook Survey" [ref=e139] [cursor=pointer]:
              - /url: /us/en/insights/industry/health-care/life-sciences-and-health-care-industry-outlooks/2026-us-health-care-executive-outlook.html
            - text: findings reinforce this momentum, with over 80% of health care executives expecting both agentic AI and generative AI to deliver moderate-to-significant value across clinical, business, and back-office functions in 2026.
          - generic [ref=e145]:
            - generic [ref=e147]:
              - link "Download" [ref=e148] [cursor=pointer]:
                - /url: /content/dam/insights/articles/2026/us188461_chs-agentic-ai-in-health-care/content-images/US188461_Figure2.png
                - generic [ref=e149]: 
              - link "Share infographic" [ref=e150] [cursor=pointer]:
                - /url: "#"
                - generic [ref=e151]: 
            - text:     
          - generic [ref=e153]:
            - paragraph [ref=e157]: "As obstacles are mitigated, health care leaders could face a different challenge: deciding where autonomous action can unlock enterprise value without increasing clinical, financial, or compliance risk. Focus group participants described a near-term decision—whether to keep efforts in pilots or invest in enterprise scaling that could meaningfully reshape workflows across care and operations."
            - generic [ref=e160]:
              - heading "A majority of health care leaders expect agentic AI to change operating models" [level=2] [ref=e161]
              - paragraph [ref=e162]: Survey results indicate that organizations are deploying the tech in more strategic areas beyond back-office operations. More than 80% of health systems are prioritizing agentic AI for clinical operations and care delivery, as well as revenue cycle management. Similarly, 70% of health plans are prioritizing agentic AI for utilization management, prior authorization processes, and claims management.
              - paragraph [ref=e163]: Highly transformational use cases involve ecosystems of agents working together to deliver proactive solutions across health systems and health plan networks. Focus group participants suggested that these agentic ecosystems could improve operational efficiency and reduce organizational knowledge silos by making information, once gated by processes and ticket-based handoffs, more accessible. This, in turn, can support enterprise goals such as better clinical outcomes, improved operations, and higher consumer satisfaction, provided appropriate validation and governance are in place.
              - paragraph [ref=e164]: Leaders who participated in the focus groups highlighted what transformation could look like as agentic AI is implemented across various functional areas over the next two to three years (figure 3).
          - generic [ref=e170]:
            - generic [ref=e172]:
              - link "Download" [ref=e173] [cursor=pointer]:
                - /url: /content/dam/insights/articles/2026/us188461_chs-agentic-ai-in-health-care/content-images/US188461_Figure3.png
                - generic [ref=e174]: 
              - link "Share infographic" [ref=e175] [cursor=pointer]:
                - /url: "#"
                - generic [ref=e176]: 
