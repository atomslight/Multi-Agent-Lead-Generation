          - generic [ref=e181]:
            - heading "Enhancing consumer engagement" [level=3] [ref=e182]
            - paragraph [ref=e183]:
              - text: Consumer engagement across the health care ecosystem has long been hindered by fragmentation and friction.
              - superscript [ref=e184]:
                - link "Endnotes reference number 3" [ref=e185] [cursor=pointer]:
                  - /url: "#endnote-3"
                  - text: "3"
              - text: Agentic AI may be well suited to addressing these challenges and could help reduce organizational silos by making information more widely available and accessible. It can also orchestrate complex patient and member journeys and elevate the overall experience, not just optimize messaging (where traditional AI has often focused). By improving the coordination of benefits, supporting care navigation, and helping to close care gaps, agentic AI can help shift consumer engagement from reactive touchpoints to a more proactive, continuous, and personalized model of care.
            - paragraph [ref=e186]: One technology leader shared during the focus group discussions that “AI agents can guide patients through check-ins, explain lab results in everyday language, offer personalized wellness tips, monitor recovery after discharge, and clarify insurance benefits. These interactions are continuous, personalized, and empathetic, bridging gaps between visits and empowering patients.”
            - paragraph [ref=e187]: Key outcomes from enhancing consumer engagement through agentic AI include more personalized outreach based on diagnosis and preferences, and simplified benefits and care navigation. These improvements may enhance health literacy and patient confidence and, in some contexts, may contribute to fewer adverse health outcomes and readmissions. For customer support teams, this may help in reducing burnout and improving efficiency.
            - paragraph [ref=e188]:
              - text: For example, Humana Inc.’s member support team handles millions of member questions and interactions each year, often creating significant workload burden. The company recently launched an agentic AI tool to help its member advocates respond to member questions quicker, with greater precision, and in a personalized manner. The tool can summarize call conversations, foresee member needs, and autonomously guide member advocates with the most relevant information. With the agentic AI tool supporting the complexity of benefits in the background, member advocates can focus on member care and engagement.
              - superscript [ref=e189]:
                - link "Endnotes reference number 4" [ref=e190] [cursor=pointer]:
                  - /url: "#endnote-4"
                  - text: "4"
          - generic [ref=e197]:
            - blockquote [ref=e200]: “AI agents can guide patients through check-ins, explain lab results in everyday language, offer personalized wellness tips, monitor recovery after discharge, and clarify insurance benefits. These interactions are continuous, personalized, and empathetic, bridging gaps between visits and empowering patients.”
            - generic [ref=e201]: – Agentic AI leader from a technology organization
          - generic [ref=e206]:
            - heading "Rethinking care delivery" [level=3] [ref=e207]
            - paragraph [ref=e208]: Another critical area of focus is reimagining how care is delivered. Insights from our focus group discussions (figure 3) suggest that agentic AI can transform care delivery from manually collating patient data across disparate systems to integrating data across platforms for a unified view. This includes shifting clinical documentation from a static, retrospective record to a dynamic, proactive, and predictive tool.
            - paragraph [ref=e209]: Key outcomes from rethinking care delivery through agentic AI could include breaking down data silos to enable a more longitudinal, cross-source view of the patient record, closing information gaps, and reducing the risk of errors. Agentic AI could help flag risks earlier and recommend—or, where appropriate, initiate—predefined follow-up actions to help prevent adverse events, reduce readmissions, elevate clinicians’ roles toward direct patient care, support continuity of care, and strengthen patient trust.
            - paragraph [ref=e210]: "As one health system executive put it: “Agentic AI can unify data into a longitudinal record, enabling better decision-making, proactive follow-up, and reduced readmissions. This is transformative because the system gains agency, moving from a passive data repository to an active participant in care delivery.”"
            - paragraph [ref=e211]:
              - text: For instance, Stanford Health Care has piloted an agentic approach that brings personalized real-world evidence into the electronic health record (EHR) at the point of care. Using Stanford’s ChatEHR to interpret the patient record (including details like the visit reason), the agentic tool can proactively generate relevant evidence to inform treatment decisions without requiring the physician to initiate a query. Stanford is also combining this with ambient listening to capture encounter context and further streamline documentation and workflow.
              - superscript [ref=e212]:
                - link "Endnotes reference number 5" [ref=e213] [cursor=pointer]:
                  - /url: "#endnote-5"
                  - text: "5"
          - generic [ref=e220]:
            - blockquote [ref=e223]: “Agentic AI can unify data into a longitudinal record, enabling better decision-making, proactive follow-up, and reduced readmissions. This is transformative because the system gains agency, moving from a passive data repository to an active participant in care delivery.”
            - generic [ref=e224]: – Health care tech executive from a health system
          - generic [ref=e229]:
            - heading "Transforming workforce capability" [level=3] [ref=e230]
            - paragraph [ref=e231]: As illustrated in figure 3, workforce capability transformation is one of the key areas where agentic AI can drive meaningful impact. Insights from our focus group discussions highlight that agentic AI can help reduce labor-intensive administrative work by efficiently analyzing large quantities of imaging data, identifying patterns and correlations, and associating those findings with patient medical histories.
            - paragraph [ref=e232]: Key outcomes from rewiring workforce operations through agentic AI can include lowering cognitive overload, reducing burnout and turnover, and improving job satisfaction and accuracy. As one agentic AI leader noted during our focus group discussions, “AI agents can target high-friction touchpoints, enabling faster and more accurate diagnoses, restoring time, clarity, and control to frontline staff, reducing burnout, improving retention, and allowing them to focus on complex decision-making, elevating the quality of care.” This shift can free clinicians and other staff to focus on more complex care and spend more time with patients.
            - paragraph [ref=e233]:
              - text: One example is Sentara Health deploying an agentic AI solution to enable virtual nursing capabilities such as ambient documentation, remote consultation, ambient observation, and care management at scale. Within months of deployment, the agentic AI solution has reclaimed thousands of nursing hours across its facilities.
              - superscript [ref=e234]:
                - link "Endnotes reference number 6" [ref=e235] [cursor=pointer]:
                  - /url: "#endnote-6"
                  - text: "6"
          - generic [ref=e242]:
            - blockquote [ref=e245]: “AI agents can target high-friction touchpoints, enabling faster and more accurate diagnoses, restoring time, clarity, and control to frontline staff, reducing burnout, improving retention, and allowing them to focus on complex decision-making, elevating the quality of care.”
            - generic [ref=e246]: – Agentic AI leader from a technology organization
          - generic [ref=e248]:
            - generic [ref=e251]:
              - heading "Modernizing back-office operations" [level=3] [ref=e252]
              - paragraph [ref=e253]: Back-office operations are among the earliest and most common areas of focus for agentic AI transformation. Insights from our focus group discussions (figure 3) show how agentic AI can reshape back-office functions from manual and episodic activities to more autonomous, continuous resolutions.
              - paragraph [ref=e254]: "As one health plan executive from our focus group discussions mentioned: “Agentic AI monitors expiring licenses, verifies credentials against authoritative sources, proactively updates payer databases, and escalates exceptions for human review only when needed. This leads to a shift from static forms to intelligent orchestration, manual checklists to automated verification, and chronic bottlenecks to proactive, self-correcting systems.”"
              - paragraph [ref=e255]: Key outcomes of transforming back-office operations with agentic AI could include fewer manual handoffs between systems, faster process cycle times, and more robust and resilient operations. Together, these improvements can help enable autonomous follow-through, end-to-end orchestration across systems, and the redeployment of staff to higher-skill work.
              - paragraph [ref=e256]:
                - text: For example, Mayo Clinic is deploying and exploring AI agent approaches to streamline provider and payer administrative workflows. These efforts support processes such as eligibility and benefit verification, prior authorization and utilization management, claims-related clinical information exchange, and prescription support.
                - superscript [ref=e257]:
                  - link "Endnotes reference number 7" [ref=e258] [cursor=pointer]:
                    - /url: "#endnote-7"
                    - text: "7"
              - heading "Transforming payment processes" [level=3] [ref=e259]
              - paragraph [ref=e260]:
                - text: Payment process modernization is a priority area for transformation because payment workflows are inherently complex and multistep—exactly the type of challenge agentic AI is designed to address, according to focus group leaders. Whereas traditional AI is largely focused on analysis rather than decision-making, agentic AI can support and eventually execute sophisticated end-to-end sequences of actions.
                - superscript [ref=e261]:
                  - link "Endnotes reference number 8" [ref=e262] [cursor=pointer]:
                    - /url: "#endnote-8"
                    - text: "8"
                - text: This capability enables a shift from manual, potentially error-prone claims processing and reactive corrections to proactive, zero-touch adjudication with built-in denial prevention.
              - paragraph [ref=e263]: Agentic AI can help reduce error rates and resolve issues faster by enabling real-time problem-solving and proactive claims management. In turn, it can reduce denial rates, accelerate and optimize provider reimbursement, lower days in accounts receivable, and improve both member and staff satisfaction by shifting effort to higher-value work. As one health system tech executive who participated in the focus group discussions said, “Agentic AI can validate codes against payer rules in real time, auto-correct errors, and communicate with payers directly, thereby reducing denials, accelerating claim resolution, and freeing staff to focus on complex cases.”
              - paragraph [ref=e264]:
                - generic [ref=e265]:
                  - text: An example is MUSC Health deploying AI agents to complete 40% of prior authorizations without human involvement, which has helped MUSC significantly reduce manual work.
                  - superscript [ref=e266]:
                    - link "Endnotes reference number 9" [ref=e267] [cursor=pointer]:
                      - /url: "#endnote-9"
                      - text: "9"
            - generic [ref=e270]:
              - heading "Making agentic AI core to health care organizations’ strategies to help maximize impact" [level=2] [ref=e271]
              - paragraph [ref=e272]: Our survey suggests that both the timing and shape of an organization’s commitment to agentic AI may influence the size of the payoff. To help maximize impact, health care organizations should think holistically about how agentic AI can be implemented to operate systematically at an enterprise level, rather than treating it as a standalone or purely experimental initiative.
          - generic [ref=e278]:
            - generic [ref=e280]:
              - link "Download" [ref=e281] [cursor=pointer]:
                - /url: /content/dam/insights/articles/2026/us188461_chs-agentic-ai-in-health-care/content-images/US188461_Figure4.png
                - generic [ref=e282]: 
              - link "Share infographic" [ref=e283] [cursor=pointer]:
                - /url: "#"
                - generic [ref=e284]: 
            - text:     
          - generic [ref=e286]:
            - generic [ref=e289]:
              - paragraph [ref=e290]:
                - text: "Of the survey respondents, the early adopters—those currently implementing agentic AI in operations—are primarily large organizations (with annual revenue greater than US$5 billion) (65%), while the watchers—those waiting for external evidence before investing—are overwhelmingly small and medium organizations (with annual revenue greater than US$500 million but less than US$5 billion) (87%) (figure 4). Size can be a proxy for readiness: Larger health care organizations tend to have stronger data foundations, governance, and change capacity, which can be prerequisites for moving beyond pilots into operational integration."
                - superscript [ref=e291]:
                  - link "Endnotes reference number 10" [ref=e292] [cursor=pointer]:
                    - /url: "#endnote-10"
                    - text: "10"
                - text: Smaller organizations may be more constrained, making a “wait and see” approach feel rational. However, survey results suggest that waiting may come with lower expected value.
              - paragraph [ref=e293]: That dynamic is reinforced by solution strategy. Early adopters are prioritizing multi-agent solutions (82%), while watchers prefer point solutions (92%). Point solutions can generate incremental efficiency in discrete tasks but often don’t redesign end-to-end workflows. Multi-agent systems, by contrast, are built to orchestrate work across functions by coordinating decisions, handoffs, and execution across care and administrative domains, which potentially creates compounding benefits at the system level.
              - paragraph [ref=e294]: "A telling pattern from our survey is the watcher paradox: even while staying on the sidelines, 100% of watchers expect to increase investment in the next two to three years. Yet only 13% expect more than 20% cost savings in that same timeframe (versus 59% of early adopters). In other words, late movers plan to invest but anticipate less impact, suggesting a catch-up approach in which spending focuses on limited use cases and risk mitigation rather than operating-model transformation."
              - paragraph [ref=e295]: "Early adopters appear to be forming a reinforcing cycle: greater readiness enables multi-agent bets, which increase confidence in larger savings, which justifies deeper process redesign and faster learning. The competitive implication is that agentic AI could widen performance gaps, with early adopters positioned to capture productivity gains and redeploy them into resilience, experience, and growth, while watchers risk arriving later with a lower return ceiling."
              - paragraph [ref=e296]: Taken together, the findings provide a basis for prioritizing and sequencing agentic AI initiatives according to organizational size, business complexity, and AI implementation maturity.
              - paragraph [ref=e297]: "Quick wins: Small, low-effort improvements that can be delivered quickly with existing resources. Examples from our focus group discussions include:"
              - list [ref=e298]:
                - listitem [ref=e299]: Automate patient intake with digital forms that pre-populate the EHR and combine that information with ambient scribe inputs to streamline clinical documentation.
              - list [ref=e300]:
                - listitem [ref=e301]: Streamline prior authorization and ingest payment documents such as invoice data and denial letters to support claims reconciliation, identify denial drivers, and suggest appeal actions.
              - paragraph [ref=e302]: "Strategic initiatives: Mid-sized efforts that create reusable building blocks, with benefits that grow as they scale across the system. Examples from our focus group discussions include:"
              - list [ref=e303]:
                - listitem [ref=e304]: Unify patient data across systems, such as EHR, claims, and customer relationship management, so agentic AI can synchronize structured information and surface key findings through intelligent prompts to streamline clinical review.
              - list [ref=e305]:
                - listitem [ref=e306]: Detect fraud, waste, and abuse by analyzing pre-payment patterns and running continuous compliance surveillance.
              - paragraph [ref=e307]: "Major undertakings: Complex programs that can fundamentally change how work gets done. These efforts may deliver higher value but typically require time, budget, and strong governance. Examples from our focus group discussions include:"
              - list [ref=e308]:
                - listitem [ref=e309]: Forecast patient volumes using real-time clinical signals to optimize staffing and flag safety risks.
              - list [ref=e310]:
                - listitem [ref=e311]: Automate end-to-end claims adjudication by validating codes in real time and handling exceptions.
            - generic [ref=e314]:
              - heading "A path to impact with agentic AI for health care organizations" [level=2] [ref=e315]
              - paragraph [ref=e316]: "To help amplify value, health care organizations can embed agentic AI into core operations and, over time, evolve toward an enterprise AI layer that works across transactional systems. Done well, this layer can help connect work across consumer, clinical, back-office, and payment journeys. Key considerations include:"
              - list [ref=e317]:
                - listitem [ref=e318]: "Plan for continuous evolution, not a fixed end state: Implementing a coordinated set of agents alongside human teams requires ongoing adjustment. Health care organizations may need to realign clinical handoffs and administrative documentation, reshape communication patterns across customer relationship management and compliance activities, and clarify decision authority and accountability across back-office functions. Creating space to recognize real-time learning and experimentation as meaningful progress—and, ultimately, as a core strategy for reducing organizational risk—is important."
              - list [ref=e319]:
                - listitem [ref=e320]: "Prepare the workforce for a new operating model: Empower teams to move from routine processing to oversight, while keeping humans accountable for critical decisions and for validating AI outputs. Organizations can adopt workflow tools or start with pre-structured tasks with clear priorities, flagged urgency, and suggested next steps to help optimize capacity for high-value, patient-facing work."
              - list [ref=e321]:
                - listitem [ref=e322]: "Build trust through design and governance: Establish guardrails for decision-making, privacy, data quality, ethics, and transparency. Governance should enable traceability and explainability (understanding who made a decision, what was decided, and why), as well as clear ownership for monitoring performance and responding to model drift and downstream errors. In practice, this can support use cases like health system post-discharge monitoring to improve care continuity and patient experience, and payer prior authorization optimization through closed-loop reporting and root-cause analysis. Over time, durable progress is likely to be defined by safety and reliability, not speed."
              - paragraph [ref=e323]: Agentic AI is emerging as a practical capability, but organizations still face a choice in how they deploy it. They can either deploy it as tactical point solutions to relieve near-term pressure or as an end-to-end operating model change. That choice will likely shape which health care leaders can reduce costs, stabilize their workforce, and sustain patient trust in the years ahead.
          - generic [ref=e327]:
            - heading "Methodology" [level=3] [ref=e328]
            - generic [ref=e333]:
              - paragraph [ref=e334]: The Deloitte Center for Health Solutions surveyed 100 health care technology executives in September 2025, including chief technology officers, chief information officers, chief digital officers, chief AI officers, chief innovation officers, and vice presidents responsible for technology, digital, and strategy. Respondents were from 50 large US health systems and 50 health plans, with annual revenues exceeding US$500 million, including multihospital systems, independent hospitals, academic medical centers, and health insurance organizations. The survey explored the current state of agentic AI adoption and implementation in health care.
              - paragraph [ref=e335]
              - paragraph [ref=e336]: The center also conducted focus groups with 35 health care technology executives and agentic AI leaders to identify priority opportunities and practical implementation considerations across innovation areas in health care. Findings from the survey and focus groups are directional and reflect the perspectives of participating organizations at the time of data collection.
