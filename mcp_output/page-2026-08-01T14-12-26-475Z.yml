          - generic [ref=f15e183]:
            - generic [ref=f15e185]:
              - heading "Introduction" [level=2] [ref=f15e186]
              - generic [ref=f15e187]:
                - paragraph [ref=f15e188]:
                  - text: Over the past decade, artificial intelligence (AI) has undergone a profound and rapid transformation in medicine, demonstrating unprecedented performance on complex tasks, sometimes even approaching near-expert medical reasoning
                  - superscript [ref=f15e189]:
                    - link "Reference 1" [ref=f15e190] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR1
                      - text: "1"
                  - text: . These advances have propelled AI beyond narrow, single-purpose tools
                  - superscript [ref=f15e191]:
                    - link "Reference 2" [ref=f15e192] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR2
                      - text: "2"
                  - text: ", leading to the emergence of AI agents and Agentic AI characterized by greater efficiency, autonomous operation, advanced reasoning, self-learning, and more dynamic interactions"
                  - superscript [ref=f15e193]:
                    - link "Reference 3" [ref=f15e194] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR3
                      - text: "3"
                  - text: .
                - paragraph [ref=f15e195]:
                  - text: AI agents distinguish themselves from previous AIs by adapting autonomously with minimal human intervention, and integrating effectively with specialized models, often operating within sophisticated multi-agent frameworks and invoking external tools
                  - superscript [ref=f15e196]:
                    - link "Reference 3" [ref=f15e197] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR3
                      - text: "3"
                    - text: ","
                    - link "Reference 4" [ref=f15e198] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR4
                      - text: "4"
                  - text: . The ability of these agents to manage complex tasks collaboratively, offering a higher degree of operational autonomy and adaptability, is a hallmark of next-generation AI systems
                  - superscript [ref=f15e199]:
                    - link "Reference 5" [ref=f15e200] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR5
                      - text: "5"
                  - text: (Fig.
                  - link "1" [ref=f15e201] [cursor=pointer]:
                    - /url: /articles/s41746-026-02517-5#Fig1
                  - text: ). Specifically, AI agents that exhibit the highest levels of decision-making, adaptability, and self-sufficiency are referred to as Agentic AIs
                  - superscript [ref=f15e202]:
                    - link "Reference 6" [ref=f15e203] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR6
                      - text: "6"
                  - text: . However, the distinction between Agentic AI and AI agents remains unclear in the current literature, as both refer to systems capable of autonomous actions and goal-directed behavior
                  - superscript [ref=f15e204]:
                    - link "Reference 6" [ref=f15e205] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR6
                      - text: "6"
                    - text: ","
                    - link "Reference 7" [ref=f15e206] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR7
                      - text: "7"
                  - text: .
                - 'figure "Fig. 1: Agentic AI Workflow in healthcare." [ref=f15e208]':
                  - generic [ref=f15e211]:
                    - generic [ref=f15e212]:
                      - 'img "Fig. 1: Agentic AI Workflow in healthcare." [ref=f15e214]'
                      - link "Full size image figure 1" [ref=f15e216] [cursor=pointer]:
                        - /url: /articles/s41746-026-02517-5/figures/1
                        - text: Full size image
                    - paragraph [ref=f15e220]:
                      - text: The process begins with a human thinker defining a clinical or operational goal. The Agentic AI system then perceives and gathers relevant data inputs, autonomously planning and executing actions through key features, such as goal-directed operation, adaptive behavior, advanced reasoning, independent decision-making, and multi-agent collaboration supported by tool/API integration. The workflow culminates in delivering actionable outputs to the healthcare worker, supporting informed decision-making, and enabling diverse applications in clinical practice. Created in BioRender. Collaco, B. (2025)
                      - link "https://BioRender.com/tkl5pm7" [ref=f15e221] [cursor=pointer]:
                        - /url: https://BioRender.com/tkl5pm7
                      - text: .
                - paragraph [ref=f15e222]:
                  - text: Additionally, although this breakthrough is paramount for transformative applications in healthcare, there is unfortunately a limited number of studies that rigorously explore their applications in the medical field. These promising agentic systems could autonomously analyze complex medical data, personalize treatment plans, and support clinical decision-making, ultimately improving efficiency and patient outcomes while easing clinician workload
                  - superscript [ref=f15e223]:
                    - link "Reference 8" [ref=f15e224] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR8
                      - text: "8"
                  - text: .
                - paragraph [ref=f15e225]:
                  - text: While existing reviews have examined broad applications of AI in healthcare, such as diagnostic support, predictive modeling, and interpretability, these works either adopt a general AI focus without distinguishing autonomous systems or remain narrative in nature
                  - superscript [ref=f15e226]:
                    - link "Reference 6" [ref=f15e227] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR6
                      - text: "6"
                    - text: ","
                    - link "Reference 9" [ref=f15e228] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR9
                      - text: "9"
                    - text: ","
                    - link "Reference 10" [ref=f15e229] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR10
                      - text: "10"
                  - text: . Importantly, no one has systematically investigated Agentic AI or assessed its role specifically in healthcare, including prevailing definitions, features, limitations, and operational characteristics that set it apart from other forms of AI. To our knowledge, this is the first review to address that gap by analyzing the applications of Agentic AI in healthcare and proposing a conceptual clarification between AI agents and Agentic AI.
            - generic [ref=f15e231]:
              - heading "Results" [level=2] [ref=f15e232]
              - generic [ref=f15e233]:
                - heading "Study selection and baseline characteristics" [level=3] [ref=f15e234]
                - paragraph [ref=f15e235]:
                  - text: "The initial search across five databases yielded 984 records. After removing duplicates and screening by title and abstract, 89 papers were retrieved for full-text assessment against predefined inclusion and exclusion criteria. After full-text screening, 82 records were excluded: 53 did not meet the Agentic AI inclusion criteria, four were not peer-reviewed, three lacked medical applications, one was an abstract only, four were reviews, three were clinical trial registries, and 14 were not fully available. Finally, on April 29, 2025, seven studies were included in this review (Fig."
                  - link "2" [ref=f15e236] [cursor=pointer]:
                    - /url: /articles/s41746-026-02517-5#Fig2
                  - text: ). Study characteristics are reported in Table
                  - link "1" [ref=f15e237] [cursor=pointer]:
                    - /url: /articles/s41746-026-02517-5#Tab1
                  - text: .
                - figure "Fig. 2" [ref=f15e239]:
                  - generic [ref=f15e242]:
                    - generic [ref=f15e243]:
                      - img "Fig. 2" [ref=f15e245]
                      - link "Full size image figure 2" [ref=f15e247] [cursor=pointer]:
                        - /url: /articles/s41746-026-02517-5/figures/2
                        - text: Full size image
                    - paragraph [ref=f15e251]: The PRISMA flow diagram of the study selection process.
                - figure "Table 1 Baseline characteristics of the included studies" [ref=f15e253]:
                  - link "Full size table 1" [ref=f15e256] [cursor=pointer]:
                    - /url: /articles/s41746-026-02517-5/tables/1
                    - text: Full size table
                - paragraph [ref=f15e259]:
                  - text: The included studies were highly heterogeneous, differing in study design, measured outcomes, and clinical domains. Only one randomized controlled trial (RCT) evaluated different lifestyle interventions for cancer survivors, involving 42 patients across three trial arms
                  - superscript [ref=f15e260]:
                    - link "Reference 11" [ref=f15e261] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR11
                      - text: "11"
                  - text: . The remaining articles were experimental and did not involve patient recruitment, consisting of simulation-based experiments
                  - superscript [ref=f15e262]:
                    - link "Reference 12" [ref=f15e263] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR12
                      - text: "12"
                    - text: ","
                    - link "Reference 13" [ref=f15e264] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR13
                      - text: "13"
                  - text: ", a feasibility study employing a retrospective design"
                  - superscript [ref=f15e265]:
                    - link "Reference 14" [ref=f15e266] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR14
                      - text: "14"
                  - text: ", computational studies"
                  - superscript [ref=f15e267]:
                    - link "Reference 15" [ref=f15e268] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR15
                      - text: "15"
                    - text: ","
                    - link "Reference 16" [ref=f15e269] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR16
                      - text: "16"
                  - text: ", and a diagnostic accuracy study to evaluate exosome-based detection of hepatocellular carcinoma (HCC)"
                  - superscript [ref=f15e270]:
                    - link "Reference 17" [ref=f15e271] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR17
                      - text: "17"
                  - text: . The USA
                  - superscript [ref=f15e272]:
                    - link "Reference 11" [ref=f15e273] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR11
                      - text: "11"
                    - text: ","
                    - link "Reference 16" [ref=f15e274] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR16
                      - text: "16"
                  - text: and China
                  - superscript [ref=f15e275]:
                    - link "Reference 14" [ref=f15e276] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR14
                      - text: "14"
                    - text: ","
                    - link "Reference 15" [ref=f15e277] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR15
                      - text: "15"
                    - text: ","
                    - link "Reference 17" [ref=f15e278] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR17
                      - text: "17"
                  - text: represented most study settings. Clinical domains varied, with particular emphasis on radiology and oncology, but also included trauma care and rehabilitation. Overall, while these studies demonstrate the potential of Agentic AI across diverse applications, the predominance of experimental and computational designs—and the presence of only one RCT—highlights the nascent stage of the field and underscores the need for more robust clinical validation.
                - heading "Applications of Agentic AI in Healthcare" [level=3] [ref=f15e279]
                - paragraph [ref=f15e280]:
                  - text: Agentic AI systems demonstrated autonomy in task execution and action initiation, requiring minimal human input to achieve specific goals. Their workflow environment results varied, ranging from non-significant effects
                  - superscript [ref=f15e281]:
                    - link "Reference 11" [ref=f15e282] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR11
                      - text: "11"
                  - text: to excellent outcomes, including 94.1% accuracy in differentiating cancer from controls
                  - superscript [ref=f15e283]:
                    - link "Reference 17" [ref=f15e284] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR17
                      - text: "17"
                  - text: ", 87% accuracy in adjusting gameplay"
                  - superscript [ref=f15e285]:
                    - link "Reference 13" [ref=f15e286] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR13
                      - text: "13"
                  - text: ", and achieving state-of-the-art performance in their practical scenarios"
                  - superscript [ref=f15e287]:
                    - link "Reference 16" [ref=f15e288] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR16
                      - text: "16"
                  - text: . This highlights that while the autonomous capabilities of Agentic AI are promising, their effectiveness is highly dependent on the application and context, indicating a need for targeted development and rigorous validation to ensure consistent and significant clinical benefit.
                - paragraph [ref=f15e289]:
                  - text: The observed architectural diversity, spanning single
                  - superscript [ref=f15e290]:
                    - link "Reference 11" [ref=f15e291] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR11
                      - text: "11"
                    - text: ","
                    - link "Reference 13" [ref=f15e292] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR13
                      - text: "13"
                    - text: ","
                    - link "Reference 16" [ref=f15e293] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR16
                      - text: "16"
                    - text: ","
                    - link "Reference 17" [ref=f15e294] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR17
                      - text: "17"
                  - text: and multi-agent frameworks
                  - superscript [ref=f15e295]:
                    - link "Reference 12" [ref=f15e296] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR12
                      - text: "12"
                    - text: ","
                    - link "Reference 14" [ref=f15e297] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR14
                      - text: "14"
                    - text: ","
                    - link "Reference 15" [ref=f15e298] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR15
                      - text: "15"
                  - text: ", alongside the pervasive integration of Large Language Models (LLMs), highlights a strategic effort to enhance the sophistication and utility of Agentic AI in complex healthcare tasks."
                - paragraph [ref=f15e299]:
                  - text: The earlier Agentic AI TraumaTracker (2019), designed to function as a personal medical assistant during trauma resuscitation, was a prototype that employed two cooperating agents based on the Belief-Desire-Intention (BDI) model, a classic reasoning architecture in which beliefs represent knowledge, desires capture goals, and intentions define actions
                  - superscript [ref=f15e300]:
                    - link "Reference 10" [ref=f15e301] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR10
                      - text: "10"
                  - text: . One agent was dedicated to documentation (Tracker Agent), while the other handled real-time alert generation (Alert Generator Agent)
                  - superscript [ref=f15e302]:
                    - link "Reference 12" [ref=f15e303] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR12
                      - text: "12"
                  - text: . The system was deployed for approximately nine months, during which it supported the generation of over 430 trauma reports and autonomously triggered context-aware clinical alerts, demonstrating improved completeness and temporal accuracy of trauma documentation while minimizing alert fatigue. Next, SmartText (2021) was the first Agentic AI with a single-agent architecture to be integrated. It functioned as an autonomous coaching agent that adapted the content of its messages based on participant activity data to support physical activity goals. Compared to the other two intervention arms, it showed only a modest, non-significant effect on increasing daily step counts
                  - superscript [ref=f15e304]:
                    - link "Reference 11" [ref=f15e305] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR11
                      - text: "11"
                  - text: . The next single-agent simulation involved a virtual AI assistant (2023) trained with multiple reinforcement-learning algorithms, with Proximal Policy Optimization with Actor-Critic (PPO-AC) achieving the best results and enabling autonomous adjustment of gameplay difficulty to support therapeutic goals for children with Down syndrome
                  - superscript [ref=f15e306]:
                    - link "Reference 13" [ref=f15e307] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR13
                      - text: "13"
                  - text: .
                - paragraph [ref=f15e308]:
                  - text: Among the most recent proof-of-concept agentic systems, ChatExosome (2025) used deep learning and retrieval-augmented reasoning to diagnose HCC from exosome spectroscopy with high accuracy
                  - superscript [ref=f15e309]:
                    - link "Reference 17" [ref=f15e310] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR17
                      - text: "17"
                  - text: ", whereas MultiMedRes (2025) employed an LLM-based learner agent that decomposed complex medical questions to perform zero-shot diagnostic reasoning on chest X-ray data and achieved a state-of-the-art performance. Although it accessed multiple domain-specific expert models for the reasoning, it was classified as a single-agent architecture because these models were used as external resources under the orchestration of a single learner agent, rather than as independent agents with autonomous decision-making"
                  - superscript [ref=f15e311]:
                    - link "Reference 16" [ref=f15e312] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR16
                      - text: "16"
                  - text: . In contrast, GPT-Plan (2025) relied on several agents (Dosimetrist, Physicist, TPS_proxy, Human_proxy) to refine radiotherapy treatment plans, matching expert performance for cervical cancer and exceeding it for lung cancer
                  - superscript [ref=f15e313]:
                    - link "Reference 14" [ref=f15e314] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR14
                      - text: "14"
                  - text: ", further illustrating the expanding capabilities of Agentic AI in oncology. Finally, ProtChat (2025) also employed a multi-agent framework, comprising the User Proxy, Inference, Evaluation, Visualization, and Chat Manager agents, within a GPT-4-integrated system. It autonomously executed complex protein analysis tasks, accurately generating evaluation metrics (e.g., accuracy, ROC and PR curves) across protein property prediction, protein–protein interaction, and protein–drug interaction benchmarks without manual intervention. Its ability demonstrates direct relevance to biomedical research and therapeutic development, which are integral components of healthcare innovation"
                  - superscript [ref=f15e315]:
                    - link "Reference 15" [ref=f15e316] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR15
                      - text: "15"
                  - text: .
                - paragraph [ref=f15e317]:
                  - text: The emergence of multi-agent frameworks marks a progression toward addressing increasingly complex clinical problems by distributing specialized functions among collaborative AI agents. This division of labor enables sophisticated coordination, often achieving performance comparable to or surpassing human experts. Most of these systems integrated LLMs or multimodal LLMs with domain-specific models to improve task specificity, enhance learning efficiency, and support dynamic interactions across inference, evaluation, and visualization processes
                  - superscript [ref=f15e318]:
                    - link "14" [ref=f15e319] [cursor=pointer]:
                      - /url: "#ref-CR14"
                    - text: ","
                    - link "15" [ref=f15e320] [cursor=pointer]:
                      - /url: "#ref-CR15"
                    - text: ","
                    - link "16" [ref=f15e321] [cursor=pointer]:
                      - /url: "#ref-CR16"
                    - text: ","
                    - link "Reference 17" [ref=f15e322] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR17
                      - text: "17"
                  - text: . The reliance on LLMs reflects a critical trend in advancing Agentic AI’s ability to comprehend complex data, engage in interactive reasoning, and generate human-like responses, thereby broadening their potential for advanced diagnostic support, clinical decision-making, and seamless integration into diverse medical workflows (Fig.
                  - link "3" [ref=f15e323] [cursor=pointer]:
                    - /url: /articles/s41746-026-02517-5#Fig3
                  - text: ).
                - 'figure "Fig. 3: Current applications of Agentic AI in healthcare." [ref=f15e325]':
                  - generic [ref=f15e328]:
                    - generic [ref=f15e329]:
                      - 'img "Fig. 3: Current applications of Agentic AI in healthcare." [ref=f15e331]'
                      - link "Full size image figure 3" [ref=f15e333] [cursor=pointer]:
                        - /url: /articles/s41746-026-02517-5/figures/3
                        - text: Full size image
                    - paragraph [ref=f15e337]:
                      - text: Agentic AI systems have been explored across diverse domains, including treatment planning and diagnosis in radiation oncology, coaching and lifestyle interventions, autonomous clinical decision support, patient monitoring and warning systems, enhancing physical rehabilitation, and intelligent protein analysis in biomedicine. Created in BioRender. Collaco, B. (2025)
                      - link "https://BioRender.com/tkl5pm7" [ref=f15e338] [cursor=pointer]:
                        - /url: https://BioRender.com/tkl5pm7
                      - text: .
                - paragraph [ref=f15e339]:
                  - text: All AIs exhibited a certain degree of adaptability, restricted to the context in which they were working, but none have demonstrated adaptive behavior over time. Furthermore, several other limitations were noted. These included concerns regarding a narrow scope, bias, interpretability, dependence on the quality of training data, and challenges in real-world deployment, as six of the seven included studies have not yet been implemented in real-world settings
                  - superscript [ref=f15e340]:
                    - link "12" [ref=f15e341] [cursor=pointer]:
                      - /url: "#ref-CR12"
                    - text: ","
                    - link "13" [ref=f15e342] [cursor=pointer]:
                      - /url: "#ref-CR13"
                    - text: ","
                    - link "14" [ref=f15e343] [cursor=pointer]:
                      - /url: "#ref-CR14"
                    - text: ","
                    - link "15" [ref=f15e344] [cursor=pointer]:
                      - /url: "#ref-CR15"
                    - text: ","
                    - link "16" [ref=f15e345] [cursor=pointer]:
                      - /url: "#ref-CR16"
                    - text: ","
                    - link "Reference 17" [ref=f15e346] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR17
                      - text: "17"
                  - text: . Additionally, the complexity of developing reliable agentic behaviors, particularly in multi-agent systems, has led authors to emphasize the need for enhanced safety and ethical oversight.
                - heading "Quality assessment" [level=3] [ref=f15e347]
                - paragraph [ref=f15e348]:
                  - text: Figures
                  - link "4" [ref=f15e349] [cursor=pointer]:
                    - /url: /articles/s41746-026-02517-5#Fig4
                  - text: and
                  - link "5" [ref=f15e350] [cursor=pointer]:
                    - /url: /articles/s41746-026-02517-5#Fig5
                  - text: present the charts of included studies, evaluated using the Cochrane’s risk of bias in randomized trials tool (RoB-2) for RCTs
                  - superscript [ref=f15e351]:
                    - link "Reference 18" [ref=f15e352] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR18
                      - text: "18"
                    - text: ","
                    - link "Reference 19" [ref=f15e353] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR19
                      - text: "19"
                  - text: and the Risk of Bias in Non-randomized Studies - of Interventions (ROBINS-I) tool for non-randomized studies
                  - superscript [ref=f15e354]:
                    - link "Reference 20" [ref=f15e355] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR20
                      - text: "20"
                  - text: ", utilizing the Risk-Of-Bias VISualization (ROBVIS) tool"
                  - superscript [ref=f15e356]:
                    - link "Reference 21" [ref=f15e357] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR21
                      - text: "21"
                  - text: . Hassoon et al. (2021) had some concerns about bias due to participants’ awareness of the intervention, but did not raise any concerns about the other aspects. Across the six observational studies, the overall risk of bias ranged from moderate to critical, primarily due to the experimental or preclinical nature of the research. Croatti et al. (2019) and Mariselvam et al. (2023) were assessed as having a serious to critical risk of bias, respectively, due to the absence of control groups and reliance on simulations. However, they demonstrated promising systems with relevant applications and features that matched criteria. The other studies demonstrated an overall moderate risk of bias, primarily due to a lack of confounder adjustment and insufficient real-world clinical validation.
                - 'figure "Fig. 4: Risk of Bias Chart for the included RCT using the RoB-2 tool." [ref=f15e359]':
                  - generic [ref=f15e362]:
                    - generic [ref=f15e363]:
                      - 'img "Fig. 4: Risk of Bias Chart for the included RCT using the RoB-2 tool." [ref=f15e365]'
                      - link "Full size image figure 4" [ref=f15e367] [cursor=pointer]:
                        - /url: /articles/s41746-026-02517-5/figures/4
                        - text: Full size image
                    - paragraph [ref=f15e371]:
                      - text: Overall, the study demonstrated some concerns of bias. This figure was created in BioRender. Collaco, B. (2025)
                      - link "https://BioRender.com/zmicnxq" [ref=f15e372] [cursor=pointer]:
                        - /url: https://BioRender.com/zmicnxq
                      - text: and using the publicly available ROBVIS tool.
                - 'figure "Fig. 5: Risk of Bias Chart for the observational studies using the ROBINS-I tool." [ref=f15e374]':
                  - generic [ref=f15e377]:
                    - generic [ref=f15e378]:
                      - 'img "Fig. 5: Risk of Bias Chart for the observational studies using the ROBINS-I tool." [ref=f15e380]'
                      - link "Full size image figure 5" [ref=f15e382] [cursor=pointer]:
                        - /url: /articles/s41746-026-02517-5/figures/5
                        - text: Full size image
                    - paragraph [ref=f15e386]:
                      - text: Croatti et al. (2019) and Mariselvam et al. (2023) demonstrated an overall serious and critical risk of bias, respectively, whereas the other studies demonstrated an overall moderate risk of bias. This figure was created in BioRender. Collaco, B. (2025)
                      - link "https://BioRender.com/zmicnxq" [ref=f15e387] [cursor=pointer]:
                        - /url: https://BioRender.com/zmicnxq
                      - text: and using the publicly available ROBVIS tool.
            - generic [ref=f15e389]:
              - heading "Discussion" [level=2] [ref=f15e390]
              - generic [ref=f15e391]:
                - paragraph [ref=f15e392]:
                  - text: AI systems have evolved significantly over time, with key differences emerging in how they function and interact with their environments, demonstrating increasing levels of autonomy and complexity. Traditional AI systems are built to perform narrow, well-defined tasks, such as classifying images or following preset rules, without the flexibility to adapt or generalize beyond their programming
                  - superscript [ref=f15e393]:
                    - link "Reference 6" [ref=f15e394] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR6
                      - text: "6"
                    - text: ","
                    - link "Reference 22" [ref=f15e395] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR22
                      - text: "22"
                  - text: . Building on this foundation, Generative AI (GenAI) introduced a paradigm shift by enabling systems to create novel outputs, including text, images, and code, through pattern recognition across vast datasets. GenAI models, such as LLMs, marked a critical transition from purely task-specific tools to systems capable of open-ended interaction and content generation. However, despite their creativity and versatility, they remain highly dependent on user input and lack true initiative, as they cannot set goals or act autonomously without external prompting
                  - superscript [ref=f15e396]:
                    - link "Reference 23" [ref=f15e397] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR23
                      - text: "23"
                    - text: ","
                    - link "Reference 24" [ref=f15e398] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR24
                      - text: "24"
                  - text: . Their widespread adoption was exemplified by the release of ChatGPT by OpenAI in 2022, which popularized generative models for diverse applications
                  - superscript [ref=f15e399]:
                    - link "Reference 23" [ref=f15e400] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR23
                      - text: "23"
                    - text: ","
                    - link "Reference 25" [ref=f15e401] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR25
                      - text: "25"
                  - text: .
                - paragraph [ref=f15e402]:
                  - text: Moving further, AI agents extend these capabilities by pursuing specific goals, making autonomous decisions, and dynamically interacting with their surroundings, albeit usually within narrow domains and with limited adaptability
                  - superscript [ref=f15e403]:
                    - link "Reference 26" [ref=f15e404] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR26
                      - text: "26"
                    - text: ","
                    - link "Reference 27" [ref=f15e405] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR27
                      - text: "27"
                  - text: . At the highest level of complexity, Agentic AI combines these features with greater independence, adaptability, and decision-making power, enabling systems to initiate actions, coordinate tasks, and respond intelligently to changing conditions with minimal human input.
                - paragraph [ref=f15e406]:
                  - text: "According to current literature, agentic systems can express several features; however, their classification varies among published studies. Their cornerstone and the two most present ones are [I] Autonomous Operation: the ability of an agent to operate without constant and direct human intervention, having greater control over actions executed"
                  - superscript [ref=f15e407]:
                    - link "Reference 4" [ref=f15e408] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR4
                      - text: "4"
                  - text: "and [II] Goal-directed Behavior: the systems not only act based on their perception of the environment, but also monitor the effects of their actions and adjust them accordingly to achieve these goals"
                  - superscript [ref=f15e409]:
                    - link "Reference 28" [ref=f15e410] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR28
                      - text: "28"
                  - text: . In this progression, traditional AI remains reactive, GenAI adds creativity without initiative, while agentic systems introduce sustained autonomy and goal orientation (Agentic AI vs. generative AI. IBM, 2025;
                  - link "https://www.ibm.com/think/topics/agentic-ai-vs-generative-ai#7281538" [ref=f15e411] [cursor=pointer]:
                    - /url: https://www.ibm.com/think/topics/agentic-ai-vs-generative-ai#7281538
                  - text: ).
                - paragraph [ref=f15e412]:
                  - text: To carry out their objectives, agentic systems often exhibit high levels of [III] adaptability to their environment, with continuous improvement over time, learning from past experiences, and optimizing workflows by leveraging advanced reasoning techniques, such as Chain-of-Thought, ReAct, and Tree-of-Thought
                  - superscript [ref=f15e413]:
                    - link "Reference 3" [ref=f15e414] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR3
                      - text: "3"
                    - text: ","
                    - link "Reference 9" [ref=f15e415] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR9
                      - text: "9"
                    - text: ","
                    - link "Reference 29" [ref=f15e416] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR29
                      - text: "29"
                  - text: . To achieve this constant efficiency enhancement and meet these goals, these AIs require [IV] action initiation, decision-making, or tool invocation
                  - superscript [ref=f15e417]:
                    - link "Reference 3" [ref=f15e418] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR3
                      - text: "3"
                    - text: ","
                    - link "Reference 22" [ref=f15e419] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR22
                      - text: "22"
                    - text: ","
                    - link "Reference 26" [ref=f15e420] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR26
                      - text: "26"
                  - text: ", which involves calling external Application Programming Interfaces (API), databases, or software tools."
                - paragraph [ref=f15e421]:
                  - text: Additionally, [V] a multi-agent framework is frequently seen when a single agent cannot carry out complex tasks. Agentic AI distributes functions among specialized AI agents, enabling sophisticated coordination and tackling complex workflows. In contrast, single-agent architectures offer simplicity, efficiency, and more transparent accountability, as one agent orchestrates all external resources, making them better suited for narrowly defined clinical tasks or diagnostic reasoning
                  - superscript [ref=f15e422]:
                    - link "Reference 30" [ref=f15e423] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR30
                      - text: "30"
                  - text: . Finally, [VI] long-term memory and [VII] retrieval-augmented/advanced reasoning complement the features that make agentic systems highly productive and operational
                  - superscript [ref=f15e424]:
                    - link "Reference 27" [ref=f15e425] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR27
                      - text: "27"
                    - text: ","
                    - link "Reference 31" [ref=f15e426] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR31
                      - text: "31"
                  - text: ", whereas earlier AI systems typically relied on short-term or task-restricted memory without the ability to carry knowledge across contexts. An overview of the various features that an Agentic AI can express compared to other AI systems is presented in Fig."
                  - link "6" [ref=f15e427] [cursor=pointer]:
                    - /url: /articles/s41746-026-02517-5#Fig6
                  - text: .
                - 'figure "Fig. 6: Features comparison across four categories of AI." [ref=f15e429]':
                  - generic [ref=f15e432]:
                    - generic [ref=f15e433]:
                      - 'img "Fig. 6: Features comparison across four categories of AI." [ref=f15e435]'
                      - link "Full size image figure 6" [ref=f15e437] [cursor=pointer]:
                        - /url: /articles/s41746-026-02517-5/figures/6
                        - text: Full size image
                    - paragraph [ref=f15e441]:
                      - text: Traditional AI, which performs narrow, rule-based tasks; Generative AI, which creates new outputs from learned patterns but remains user-dependent; AI Agents, which pursue specific goals and make limited autonomous decisions; and Agentic AI, which integrates higher levels of autonomy, adaptability, and decision-making to initiate and coordinate complex tasks. Created in BioRender. Collaco, B. (2025)
                      - link "https://BioRender.com/tkl5pm7" [ref=f15e442] [cursor=pointer]:
                        - /url: https://BioRender.com/tkl5pm7
                      - text: .
                - paragraph [ref=f15e443]:
                  - text: An important point to consider is that, although numerous papers
                  - superscript [ref=f15e444]:
                    - link "Reference 5" [ref=f15e445] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR5
                      - text: "5"
                    - text: ","
                    - link "Reference 6" [ref=f15e446] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR6
                      - text: "6"
                  - text: and several blogs (e.g., 5 Levels of agentic AI intelligence for enterprise use. Outshift 2025.
                  - link "https://outshift.cisco.com/blog/agentic-ai-intelligence-for-enterprise-use" [ref=f15e447] [cursor=pointer]:
                    - /url: https://outshift.cisco.com/blog/agentic-ai-intelligence-for-enterprise-use
                  - text: ; The Six Levels of Agentic Behavior. Vellum 2025.
                  - link "https://www.vellum.ai/blog/levels-of-agentic-behavior" [ref=f15e448] [cursor=pointer]:
                    - /url: https://www.vellum.ai/blog/levels-of-agentic-behavior
                  - text: ) describing AI agents and the features of Agentic AIs were published in 2025, the underlying concepts are not novel. In fact, the first papers mentioning software agents and agency were published around the early 1990s
                  - superscript [ref=f15e449]:
                    - link "Reference 4" [ref=f15e450] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR4
                      - text: "4"
                    - text: ","
                    - link "Reference 30" [ref=f15e451] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR30
                      - text: "30"
                    - text: ","
                    - link "Reference 32" [ref=f15e452] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR32
                      - text: "32"
                  - text: ", when researchers began to explore their capabilities."
                - paragraph [ref=f15e453]:
                  - text: Therefore, it would be reasonable to think that the difference between AI agents and Agentic AIs would be well established. However, the exact definitions remain unclear in the current literature despite more than three decades since the mention of agency across systems
                  - superscript [ref=f15e454]:
                    - link "Reference 7" [ref=f15e455] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR7
                      - text: "7"
                    - text: ","
                    - link "Reference 27" [ref=f15e456] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR27
                      - text: "27"
                    - text: ","
                    - link "Reference 29" [ref=f15e457] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR29
                      - text: "29"
                    - text: ","
                    - link "Reference 33" [ref=f15e458] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR33
                      - text: "33"
                  - text: . Authors frequently use these terms interchangeably, as they have the same meaning, which can lead to confusion regarding the underlying concepts. One possible explanation, also evident in papers included in this review, is that agentic features are not always present within an agent at the same level of complexity. In most applications, AIs exhibit varying degrees of these characteristics combined
                  - superscript [ref=f15e459]:
                    - link "Reference 5" [ref=f15e460] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR5
                      - text: "5"
                  - text: . Alternatively, a different approach is to use the term “Agentic AI systems” to describe systems that exhibit high levels of “agenticness” or agency, which is a property denoting autonomous and goal-directed behavior, rather than a fixed classification
                  - superscript [ref=f15e461]:
                    - link "Reference 29" [ref=f15e462] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR29
                      - text: "29"
                  - text: . Generally speaking, the more features a system has, the more agency it will express
                  - superscript [ref=f15e463]:
                    - link "Reference 29" [ref=f15e464] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR29
                      - text: "29"
                    - text: ","
                    - link "Reference 34" [ref=f15e465] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR34
                      - text: "34"
                  - text: ", and the more agentic it will be."
                - paragraph [ref=f15e466]:
                  - text: As there is no consensus in the literature, and based on a reasonable approach
                  - superscript [ref=f15e467]:
                    - link "Reference 29" [ref=f15e468] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR29
                      - text: "29"
                  - text: ", autonomous operation and goal-directed behavior were identified as the most relevant features to compose the criteria for AI agents to be considered agentic. Furthermore, the degree of adaptability in Agentic AI systems varies widely across published studies, often lacking clear or consistent classifications. For this reason, action initiation (tool invocation) was the last component of the minimal required criteria of the Agentic AIs to be included in this review. While additional features, such as long-term memory or multi-agent collaboration may enhance an AI system’s “degree of agency”, they are not required for establishing minimal agentic status (What is agentic AI? UC News 2025;"
                  - link "https://www.uc.edu/news/articles/2025/06/what-is-agentic-ai-definition-and-2025-guide.html?utm_source=chatgpt.com" [ref=f15e469] [cursor=pointer]:
                    - /url: https://www.uc.edu/news/articles/2025/06/what-is-agentic-ai-definition-and-2025-guide.html?utm_source=chatgpt.com
                  - text: ). Instead, the selected minimal criteria represent the irreducible foundation. Without autonomy, the system remains dependent on human operators; without goals, it becomes reactive and purposeless; and without action initiation, it cannot translate intelligence into workflow integration or real-world utility. They reflect the theoretical underpinnings of agency and the practical requirements for clinical applicability, ensuring that the classification remains rigorous and operationalizable in healthcare contexts.
                - paragraph [ref=f15e470]: Additionally, although both AI agents and Agentic AI satisfy the minimal criteria, the distinction lies in their scope and depth of application. An AI agent typically embodies them in a narrow, task-specific manner, functioning as a single autonomous entity designed for well-defined objectives.
                - paragraph [ref=f15e471]:
                  - text: Agentic AI, by contrast, applies these same criteria in a broader and more integrated fashion, demonstrating persistence, adaptability, and the ability to orchestrate complex, multi-step workflows across clinical contexts (Agentic AI vs. generative AI. IBM, 2025;
                  - link "https://www.ibm.com/think/topics/agentic-ai-vs-generative-ai#7281538" [ref=f15e472] [cursor=pointer]:
                    - /url: https://www.ibm.com/think/topics/agentic-ai-vs-generative-ai#7281538
                  - text: ). In this sense, Agentic AI represents a higher-order paradigm in which individual agents may serve as components, yet it can also take the form of a single, highly autonomous agent; in both cases, the system achieves a level of agency that enables it to function as an intelligent collaborator rather than a limited task assistant
                  - superscript [ref=f15e473]:
                    - link "Reference 10" [ref=f15e474] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR10
                      - text: "10"
                  - text: . For instance, an AI agent might autonomously schedule patient follow-up appointments within a hospital’s electronic health record, whereas an Agentic AI system could also independently identify patients at high risk of readmission, design a personalized follow-up plan, and initiate coordination with multiple clinical services.
                - paragraph [ref=f15e475]:
                  - text: This review showed increasingly autonomous behaviors in current healthcare AI systems, ranging from decision support to active patient engagement. TraumaTracker, published by Croatti et al. (2019), provides an early example of an agentic prototype designed to monitor trauma workflows; although promising, its real-world impact was evaluated only in a preliminary setting, where it generated over 430 reports and autonomously triggered alerts for abnormal vital signs
                  - superscript [ref=f15e476]:
                    - link "Reference 12" [ref=f15e477] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR12
                      - text: "12"
                  - text: . Similarly, Hassoon et al. (2021) developed SmartText. This AI-driven coaching intervention sent up to three personalized daily messages tailored to participants’ schedules, physical characteristics, sensor data, preferences, and behavioral progress
                  - superscript [ref=f15e478]:
                    - link "Reference 11" [ref=f15e479] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR11
                      - text: "11"
                  - text: .
                - paragraph [ref=f15e480]:
                  - text: Although both systems were rule-based rather than learning-based, Agentic AI evolved from rigid rule-driven designs to adaptive, personalized interventions operating in real time within two years. Mariselvam et al. (2023) marked another step forward by proposing a simulation-based system capable of dynamically tailoring VR rehabilitation tasks through real-time skill assessment and autonomous strategy optimization, moving beyond behaviorally adaptive coaching
                  - superscript [ref=f15e481]:
                    - link "Reference 13" [ref=f15e482] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR13
                      - text: "13"
                  - text: .
                - paragraph [ref=f15e483]:
                  - text: In 2025, agentic systems advanced further, adopting multi-agent architectures that proactively invoke external models, integrate multimodal data, and self-correct through reflective reasoning
                  - superscript [ref=f15e484]:
                    - link "Reference 14" [ref=f15e485] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR14
                      - text: "14"
                    - text: ","
                    - link "Reference 15" [ref=f15e486] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR15
                      - text: "15"
                  - text: . ProtChat by Huang et al. (2025) automated protein property predictions and protein−drug interactions without human intervention, while collaborating with expert models, LLMs (e.g., ChatGPT), multimodal reasoning, self-reflection, and API invocation
                  - superscript [ref=f15e487]:
                    - link "14" [ref=f15e488] [cursor=pointer]:
                      - /url: "#ref-CR14"
                    - text: ","
                    - link "15" [ref=f15e489] [cursor=pointer]:
                      - /url: "#ref-CR15"
                    - text: ","
                    - link "16" [ref=f15e490] [cursor=pointer]:
                      - /url: "#ref-CR16"
                    - text: ","
                    - link "Reference 17" [ref=f15e491] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR17
                      - text: "17"
                  - text: .
                - paragraph [ref=f15e492]:
                  - text: Radiation oncology has emerged as a particularly promising field for Agentic AI development, as demonstrated by Gu et al. (2025)
                  - superscript [ref=f15e493]:
                    - link "Reference 16" [ref=f15e494] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR16
                      - text: "16"
                  - text: ", Wang et al. (2025)"
                  - superscript [ref=f15e495]:
                    - link "Reference 14" [ref=f15e496] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR14
                      - text: "14"
                  - text: ", and Yang et al. (2025)"
                  - superscript [ref=f15e497]:
                    - link "Reference 17" [ref=f15e498] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR17
                      - text: "17"
                  - text: ", who introduced experimental systems for diagnostic reasoning, treatment planning, and cancer detection. These developments reflect a significant shift: AI systems are becoming proactive collaborators capable of handling complex, adaptive, and multimodal tasks. By contrast, prior generations of AI systems for cancer diagnosis and prognosis, primarily based on machine learning and deep learning, have demonstrated high predictive accuracy across imaging, pathology, and multimodal datasets, but typically function as task-specific decision-support tools rather than autonomous agents"
                  - superscript [ref=f15e499]:
                    - link "Reference 35" [ref=f15e500] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR35
                      - text: "35"
                    - text: ","
                    - link "Reference 36" [ref=f15e501] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR36
                      - text: "36"
                  - text: . Nonetheless, current agentic systems should still be interpreted as preliminary exploratory efforts rather than evidence of mature clinical capability. Despite the diversity of proposed approaches, only one study to date involved real patients
                  - superscript [ref=f15e502]:
                    - link "Reference 11" [ref=f15e503] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR11
                      - text: "11"
                  - text: ", and most systems remain narrowly scoped, reliant on structured or simulated data, and untested in routine clinical workflows. Collectively, the evidence indicates that Agentic AI in healthcare is still at an early developmental stage, with no system yet demonstrating the level of robustness or autonomy required for real-world deployment."
                - paragraph [ref=f15e504]:
                  - text: Beyond autonomy, another defining trait of Agentic AI systems is their ability to pursue and adapt goals dynamically, moving beyond static, predefined responses toward strategies shaped by real-time context. Unlike traditional systems that execute fixed tasks, these agents monitor outcomes, evaluate progress, and adjust their paths to align with overarching objectives. For instance, although TraumaTracker and SmartText were programmed to deliver messages to users, these systems worked to optimize workflow in trauma centers and continuously serve as coaching AI, respectively
                  - superscript [ref=f15e505]:
                    - link "Reference 11" [ref=f15e506] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR11
                      - text: "11"
                    - text: ","
                    - link "Reference 12" [ref=f15e507] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR12
                      - text: "12"
                  - text: . Moving forward, the reinforcement learning-based virtual AI assistant for children with Down syndrome continuously refined its therapeutic goals by interpreting user feedback and optimizing future interactions
                  - superscript [ref=f15e508]:
                    - link "Reference 13" [ref=f15e509] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR13
                      - text: "13"
                  - text: . In radiotherapy, GPT-Plan exemplifies goal-directed reasoning by iteratively adjusting treatment plans through self-corrective loops, mimicking the adaptive deliberation of expert dosimetrists
                  - superscript [ref=f15e510]:
                    - link "Reference 14" [ref=f15e511] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR14
                      - text: "14"
                  - text: ", and MultiMedRes extends this paradigm even further with proactive goal decomposition, breaking complex diagnostic challenges into adaptive subgoals that evolve as new information emerges"
                  - superscript [ref=f15e512]:
                    - link "Reference 16" [ref=f15e513] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR16
                      - text: "16"
                  - text: .
                - paragraph [ref=f15e514]: Despite these advances, many current systems still display goal-directed and adaptive behavior only within narrow, task-specific boundaries, often constrained by rule-based logic. Expanding this capability to support temporal adaptability, learning, redefining goals across patient trajectories, and shifting clinical evidence remains a critical frontier. Such longitudinal goal management is particularly vital in healthcare, where long-term, personalized care depends on systems that can dynamically reprioritize objectives and strategies as conditions evolve.
                - paragraph [ref=f15e515]:
                  - text: Another hallmark of Agentic AI is the ability to independently trigger and coordinate actions, transforming them from passive decision aids into active participants in clinical workflows. Modern systems increasingly demonstrate this by autonomously invoking external tools, integrating resources, and orchestrating multi-agent collaboration. ChatExosome, for example, employs retrieval-augmented generation to autonomously query specialized databases and literature, generating evidence-based diagnostic insights without human prompting
                  - superscript [ref=f15e516]:
                    - link "Reference 17" [ref=f15e517] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR17
                      - text: "17"
                  - text: . Similarly, ProtChat integrates GPT-4 with domain-specific protein language models, generating JSON outputs and seamlessly coordinating multiple analytic tools within a multi-agent framework to perform complex protein property predictions and interaction analyses
                  - superscript [ref=f15e518]:
                    - link "Reference 15" [ref=f15e519] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR15
                      - text: "15"
                  - text: . The MultiMedRes framework demonstrates even more advanced orchestration, with its learner agent dynamically querying and integrating domain expert models to iteratively refine multimodal medical reasoning
                  - superscript [ref=f15e520]:
                    - link "Reference 16" [ref=f15e521] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR16
                      - text: "16"
                  - text: . GPT-Plan demonstrates multi-agent collaboration in clinical workflows by autonomously initiating optimization processes and leveraging historical treatment data to enhance radiotherapy plans
                  - superscript [ref=f15e522]:
                    - link "Reference 14" [ref=f15e523] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR14
                      - text: "14"
                  - text: .
                - paragraph [ref=f15e524]:
                  - text: Although largely based on prototypes and exploratory studies, these capabilities illustrate a significant shift from passive decision-support systems to active, self-directed agents that can mobilize knowledge and computational resources in real time. In contrast, action-initiation mechanisms are absent in some highly autonomous diagnostic systems for conditions like diabetic retinopathy
                  - superscript [ref=f15e525]:
                    - link "37" [ref=f15e526] [cursor=pointer]:
                      - /url: "#ref-CR37"
                    - text: ","
                    - link "38" [ref=f15e527] [cursor=pointer]:
                      - /url: "#ref-CR38"
                    - text: ","
                    - link "39" [ref=f15e528] [cursor=pointer]:
                      - /url: "#ref-CR39"
                    - text: ","
                    - link "Reference 40" [ref=f15e529] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR40
                      - text: "40"
                  - text: or colon polyps
                  - superscript [ref=f15e530]:
                    - link "Reference 41" [ref=f15e531] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR41
                      - text: "41"
                  - text: ", where generating a diagnosis or referral typically does not require invoking external tools or APIs. In the oncology field, as summarized in large reviews of AI in cancer diagnosis and prognosis, most prior AI systems operate in a reactive, inference-only paradigm: models are trained to classify images, predict risk, or estimate survival outcomes, but do not autonomously initiate downstream actions, such as data retrieval, workflow orchestration, or treatment adaptation, relying instead on clinicians to interpret outputs and determine subsequent steps"
                  - superscript [ref=f15e532]:
                    - link "Reference 35" [ref=f15e533] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR35
                      - text: "35"
                    - text: ","
                    - link "Reference 36" [ref=f15e534] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR36
                      - text: "36"
                  - text: . Nevertheless, this growing capacity for action-initiating autonomy raises essential concerns regarding control boundaries, auditability, and ensuring that all autonomous actions remain aligned with clinical objectives and safety standards. As these systems gain greater procedural independence, careful governance will be essential to mitigate risks and ensure their safe integration into healthcare environments.
                - paragraph [ref=f15e535]:
                  - text: Despite expectations that Agentic AI will contribute significantly to healthcare in the future
                  - superscript [ref=f15e536]:
                    - link "Reference 9" [ref=f15e537] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR9
                      - text: "9"
                  - text: ", it is not a given that they will deliver better results. For example, although SmartText exhibited better workflow automation, the results were inferior to those of MyCoach, the other intervention in the study"
                  - superscript [ref=f15e538]:
                    - link "Reference 11" [ref=f15e539] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR11
                      - text: "11"
                  - text: . This system was not an Agentic AI because it relied on participants’ spoken intent to deliver coaching responses. This may suggest that providing patients with medical advice is more effective if they actively seek it, at least for lifestyle changes.
                - paragraph [ref=f15e540]:
                  - text: Evidence from other domains highlights several operational and safety-related challenges that are particularly relevant to the deployment of Agentic AI in healthcare. In contexts characterized by predictable, fixed workflows, the computational cost and latency associated with agentic systems may outweigh their benefits, while simpler automation frameworks often provide greater efficiency
                  - superscript [ref=f15e541]:
                    - link "Reference 26" [ref=f15e542] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR26
                      - text: "26"
                  - text: . Moreover, failures in multi-agent coordination can lead to inconsistent recommendations or systemic errors when agents miscommunicate or operate with incomplete context
                  - superscript [ref=f15e543]:
                    - link "Reference 10" [ref=f15e544] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR10
                      - text: "10"
                  - text: ", a risk that is particularly concerning in clinical scenarios with low tolerance for error, where hallucinations or incorrect reasoning may have serious consequences."
                - paragraph [ref=f15e545]:
                  - text: "In settings where precision, predictability, and timely execution are essential, such as medication dosing, radiation therapy planning, or routine anomaly detection, autonomous decision-making by Agentic AI may therefore be problematic (e.g., AI Agentic Workflows: Definitions, Use Cases & Software. Warmly, 2025;"
                  - link "https://www.warmly.ai/p/blog/ai-agentic-workflows" [ref=f15e546] [cursor=pointer]:
                    - /url: https://www.warmly.ai/p/blog/ai-agentic-workflows
                  - text: ). In oncology, for instance, delays or miscoordination in systems, such as MultiMedRes, GPT-Plan, or ChatExosome could adversely affect patient outcomes and mortality
                  - superscript [ref=f15e547]:
                    - link "42" [ref=f15e548] [cursor=pointer]:
                      - /url: "#ref-CR42"
                    - text: ","
                    - link "43" [ref=f15e549] [cursor=pointer]:
                      - /url: "#ref-CR43"
                    - text: ","
                    - link "Reference 44" [ref=f15e550] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR44
                      - text: "44"
                  - text: . Prior work has shown that conventional machine learning and deep learning systems can achieve high accuracy and reproducibility in cancer screening, diagnosis, prognosis, and treatment planning, particularly in imaging- and pathology-based workflows, supporting earlier detection, risk stratification, and clinically actionable decision support within stable, well-validated pipelines
                  - superscript [ref=f15e551]:
                    - link "Reference 35" [ref=f15e552] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR35
                      - text: "35"
                    - text: ","
                    - link "Reference 36" [ref=f15e553] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR36
                      - text: "36"
                    - text: ","
                    - link "Reference 45" [ref=f15e554] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR45
                      - text: "45"
                  - text: . Accordingly, traditional AI models remain more appropriate for well-structured, high-precision tasks due to their stability, reliability, and clearer validation pathways, whereas Agentic AI should be deployed selectively in complex, dynamic settings that genuinely require adaptability and autonomous coordination.
                - paragraph [ref=f15e555]:
                  - text: The implementation challenges also align with the “black box” nature of these systems, referred to as the non-explainability of their reasoning or internal workflow process
                  - superscript [ref=f15e556]:
                    - link "Reference 46" [ref=f15e557] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR46
                      - text: "46"
                  - text: . The lack of transparency makes it difficult for clinicians to justify AI-driven recommendations in patient charts or during shared decision-making, posing compliance risks and eroding clinician and patient trust. Cybersecurity concerns are equally pressing as vulnerabilities to the AI systems may allow manipulation or unauthorized access to electronic health records (EHRs) and expose sensitive patient data
                  - superscript [ref=f15e558]:
                    - link "Reference 47" [ref=f15e559] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR47
                      - text: "47"
                  - text: ". Such risks highlight the dual need for interpretability and robust safeguards to ensure safe and trustworthy clinical adoption (e.g., Agentic AI: A Promising Evolution, But Not Without Limits. Blueprint, 2025;"
                  - link "https://www.blueprintsys.com/blog/agentic-ai-a-promising-evolution-but-not-without-limits" [ref=f15e560] [cursor=pointer]:
                    - /url: https://www.blueprintsys.com/blog/agentic-ai-a-promising-evolution-but-not-without-limits
                  - text: ; The Six Levels of Agentic Behavior. Vellum 2025.
                  - link "https://www.vellum.ai/blog/levels-of-agentic-behavior" [ref=f15e561] [cursor=pointer]:
                    - /url: https://www.vellum.ai/blog/levels-of-agentic-behavior
                  - text: ).
                - paragraph [ref=f15e562]:
                  - text: "Beyond these technical and operational concerns, the same limitations have important ethical implications. Agentic AI is widely praised for its autonomy and potential to support clinicians in ethically complex decisions; however, this very autonomy can also increase the risk of overreliance on systems that may not be fully understood or adequately regulated. A recent example is the Bioethics AI Advisory (BAIA) framework introduced by Roy et al. (2025), which aims to assist with moral decision-making in healthcare. However, in such high-stakes situations, agentic systems must be more than technically capable: they must be built on high-quality, diverse data, routinely audited for bias and fairness, and designed to explain their reasoning in ways that healthcare professionals and families can clearly understand"
                  - superscript [ref=f15e563]:
                    - link "Reference 48" [ref=f15e564] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR48
                      - text: "48"
                  - text: ". Without these safeguards, critical questions will inevitably arise: Who is responsible if an autonomous AI causes harm? How should clinicians share authority with a system that acts independently?"
                - paragraph [ref=f15e565]:
                  - text: Regulatory frameworks are beginning to address these concerns and emphasize the need for human-in-the-loop oversight. The U.S. Food and Drug Administration (FDA) has introduced the Predetermined Change Control Plan (PCCP), which requires transparent update protocols and post-market monitoring for adaptive AI devices
                  - superscript [ref=f15e566]:
                    - link "Reference 49" [ref=f15e567] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR49
                      - text: "49"
                  - text: (e.g., FDA Issues Final Guidance on Predetermined Change Control Plans for AI-Enabled Devices. McDermott, 2024;
                  - link "https://www.mcdermottplus.com/insights/fda-issues-final-guidance-on-predetermined-change-control-plans-for-ai-enabled-svices/?utm_source=chatgpt.com" [ref=f15e568] [cursor=pointer]:
                    - /url: https://www.mcdermottplus.com/insights/fda-issues-final-guidance-on-predetermined-change-control-plans-for-ai-enabled-svices/?utm_source=chatgpt.com
                  - text: ). At the same time, the European Union (EU) AI Act categorizes healthcare AI as “high-risk”, mandating rigorous auditability and conformity assessments
                  - superscript [ref=f15e569]:
                    - link "Reference 50" [ref=f15e570] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR50
                      - text: "50"
                  - text: . However, while current regulatory frameworks provide important foundations for governing healthcare AI systems, they do not yet address the unique characteristics of Agentic AI.
                - paragraph [ref=f15e571]:
                  - text: Beyond these regulatory gaps, this review also identified several key limitations within the included studies. Most were narrowly focused, used structured or simulated data, were assessed as carrying moderate to serious risks of bias, including potential selection and publication biases, and lacked real-world clinical validation. Moreover, only one RCT was included, underscoring the gap between proof-of-concept development and real-world clinical application
                  - superscript [ref=f15e572]:
                    - link "Reference 11" [ref=f15e573] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR11
                      - text: "11"
                  - text: . Although highly agentic, the systems also failed to demonstrate the ultimate agency level according to current literature
                  - superscript [ref=f15e574]:
                    - link "Reference 3" [ref=f15e575] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR3
                      - text: "3"
                    - text: ","
                    - link "Reference 6" [ref=f15e576] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR6
                      - text: "6"
                    - text: ","
                    - link "Reference 29" [ref=f15e577] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR29
                      - text: "29"
                  - text: . They showed no adaptive behavior over time, meaning they could not refine strategies or improve performance through continuous learning, and lacked long-term memory to transfer knowledge across different clinical encounters. Without these capabilities, such systems remain confined to short-term, task-specific contexts, unable to build upon prior patient interactions or generalize effectively to new clinical settings.
                - paragraph [ref=f15e578]:
                  - text: The high heterogeneity of the included studies, spanning diverse designs, measured outcomes, and clinical domains, underscores the challenges of drawing generalizable conclusions and highlights the need for more standardized methodologies in future research. It also limits the ability to assess practical considerations, such as implementation costs, infrastructure readiness, and clinician or patient acceptance, all of which may influence real-world adoption. As such, the current evidence base remains preliminary, with few studies providing real-world validation of Agentic AI in clinical medicine. Finally, inconsistent terminology across studies emphasizes the need for more precise definitions and standardized evaluation criteria
                  - superscript [ref=f15e579]:
                    - link "Reference 5" [ref=f15e580] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR5
                      - text: "5"
                  - text: .
                - paragraph [ref=f15e581]:
                  - text: Although the development of Agentic AI systems in healthcare is still in its early stages, the results of this review suggest a defined trajectory toward more mature and impactful applications. Future work should therefore prioritize advancing these systems from proof-of-concept and simulation into real-world clinical environments, guided by structured benchmarks, multidisciplinary evaluation, and robust validation frameworks
                  - superscript [ref=f15e582]:
                    - link "Reference 51" [ref=f15e583] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR51
                      - text: "51"
                  - text: ". Incremental clinical validation will be essential: future research should begin with controlled pilot studies in well-defined, digitally mature clinical domains—such as radiology, radiation oncology, pathology, and emergency medicine—where the routine use of imaging, decision-support tools, and standardized data structures makes them especially suitable for early experimental evaluation"
                  - superscript [ref=f15e584]:
                    - link "Reference 12" [ref=f15e585] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR12
                      - text: "12"
                    - text: ","
                    - link "Reference 14" [ref=f15e586] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR14
                      - text: "14"
                    - text: ","
                    - link "Reference 16" [ref=f15e587] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR16
                      - text: "16"
                    - text: ","
                    - link "Reference 17" [ref=f15e588] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR17
                      - text: "17"
                  - text: . These settings would provide both technical readiness and higher clinician acceptance, facilitating rigorous evaluation under standardized protocols and minimizing methodological bias. Subsequent work should progress to larger, multi-center RCTs using more sophisticated agent-based systems, extended follow-up periods, and diverse patient populations. These trials must incorporate real-world data collection to reduce spectrum and selection bias, and implement continuous performance monitoring to detect model drift and maintain reliability over time.
                - paragraph [ref=f15e589]:
                  - text: From a practical standpoint, successful integration will require hospitals to address hardware and infrastructure limitations, including legacy EHR systems, inadequate GPU capacity, and fragmented data pipelines that limit real-time autonomous reasoning
                  - superscript [ref=f15e590]:
                    - link "Reference 52" [ref=f15e591] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR52
                      - text: "52"
                    - text: ","
                    - link "Reference 53" [ref=f15e592] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR53
                      - text: "53"
                  - text: . Ensuring interoperability through FHIR-based APIs, incremental hardware modernization, and exploring edge-computing or hybrid cloud solutions will be important enablers of adoption
                  - superscript [ref=f15e593]:
                    - link "Reference 54" [ref=f15e594] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR54
                      - text: "54"
                  - text: . Economic feasibility must also be considered, particularly in low-resource or rural settings where access to high-performance computing infrastructure may be limited
                  - superscript [ref=f15e595]:
                    - link "Reference 55" [ref=f15e596] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR55
                      - text: "55"
                  - text: . Approaches, such as federated learning, lightweight agent deployment, shared regional AI resources, and open-source model alternatives could help reduce costs and promote equitable access
                  - superscript [ref=f15e597]:
                    - link "Reference 56" [ref=f15e598] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR56
                      - text: "56"
                  - text: .
                - paragraph [ref=f15e599]:
                  - text: Future development should also ensure strong protection of patient information, incorporating data anonymization, differential privacy, and federated learning, so that Agentic AI systems remain clinically useful and ethically reliable
                  - superscript [ref=f15e600]:
                    - link "Reference 57" [ref=f15e601] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR57
                      - text: "57"
                  - text: . In parallel, regulatory frameworks must evolve beyond existing models, which do not yet account for the unique characteristics of autonomous, goal-directed agentic systems. Developing a standardized evaluation framework—with metrics for autonomy, safety, adaptability, transparency, and workflow integration—would enable more consistent validation and comparison of Agentic AI systems across studies. For example, an autonomy-tier classification could help define the permissible scope of independent actions, the required level of human-in-the-loop oversight, and the safety constraints associated with each level of agency. In addition, a performance framework—assessing latency, computational efficiency, and system stability under high data loads—could help identify and mitigate delays when Agentic AI systems process complex or time-sensitive medical data.
                - paragraph [ref=f15e602]:
                  - text: Compliance with established privacy regulations, such as the Health Insurance Portability and Accountability Act (HIPAA) in the USA and the General Data Protection Regulation (GDPR) in the EU will also remain necessary to safeguard patient information and maintain public trust
                  - superscript [ref=f15e603]:
                    - link "Reference 58" [ref=f15e604] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR58
                      - text: "58"
                    - text: ","
                    - link "Reference 59" [ref=f15e605] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR59
                      - text: "59"
                  - text: . Equally important is designing agentic systems that prioritize transparency and strengthen collaboration with clinicians, ensuring that they function as supportive partners rather than replacements in medical decision-making
                  - superscript [ref=f15e606]:
                    - link "Reference 60" [ref=f15e607] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR60
                      - text: "60"
                  - text: . Finally, developing holistic benchmarks will be crucial to evaluate performance, explainability, usability, and trust from a human-centered perspective, ensuring both safety and real-world applicability
                  - superscript [ref=f15e608]:
                    - link "Reference 61" [ref=f15e609] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR61
                      - text: "61"
                  - text: . Embedding these mechanisms will be key to ensuring accountability, transparency, and patient safety in healthcare while also guaranteeing that clinicians retain ultimate responsibility and decision-making authority when integrating Agentic AI into clinical workflows
                  - superscript [ref=f15e610]:
                    - link "Reference 51" [ref=f15e611] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR51
                      - text: "51"
                    - text: ","
                    - link "Reference 62" [ref=f15e612] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR62
                      - text: "62"
                  - text: .
                - paragraph [ref=f15e613]: Overall, this scoping review mapped the emerging landscape of Agentic AI in healthcare. The field remains in an early stage, characterized by heterogeneous study designs and limited clinical testing, yet its trajectory suggests substantial future potential. The systems identified in this review demonstrate how autonomous, goal-directed, and action-initiating agentic systems can support diverse clinical tasks—from diagnostic reasoning and treatment planning to patient monitoring and rehabilitation—while also highlighting the constraints that currently limit broader implementation. As research progresses, the development of standardized evaluation criteria and the expansion of real-world validation will be essential to move beyond proof-of-concept prototypes. Equally important will be addressing the ethical, regulatory, and infrastructural challenges needed to ensure safe and equitable deployment. By strengthening these foundational elements, future work can support the responsible evolution of Agentic AI into reliable clinical collaborators that augment medical decision-making and improve patient outcomes.
            - generic [ref=f15e615]:
              - heading "Methods" [level=2] [ref=f15e616]
              - generic [ref=f15e617]:
                - paragraph [ref=f15e618]:
                  - text: This scoping review was conducted in accordance with the Cochrane Collaboration Handbook for Systematic Reviews of Interventions and the Preferred Reporting Items for Systematic Reviews and Meta-Analyses extension for Scoping Reviews (PRISMA-ScR) guidelines
                  - superscript [ref=f15e619]:
                    - link "Reference 63" [ref=f15e620] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR63
                      - text: "63"
                    - text: ","
                    - link "Reference 64" [ref=f15e621] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR64
                      - text: "64"
                  - text: ". The study protocol was registered in the Open Science Framework (OSF) and is available at:"
                  - link "https://doi.org/10.17605/OSF.IO/JFT2C" [ref=f15e622] [cursor=pointer]:
                    - /url: https://doi.org/10.17605/OSF.IO/JFT2C
                  - text: . A quantitative meta-analysis was not performed due to variations in study designs, population, and outcome measures.
                - heading "Eligibility criteria" [level=3] [ref=f15e623]
                - paragraph [ref=f15e624]:
                  - text: Studies were included if they focused on Agentic AI systems applied in healthcare or clinical practice. The minimal core criteria used for considering an AI as an Agentic AI were Autonomous Operation, Goal-Directed Behavior (e.g., diagnosing diseases, optimizing processes), and Initiation of Actions/Tool Invocation (e.g., providing diagnostic outputs that trigger next steps, sending alerts)
                  - superscript [ref=f15e625]:
                    - link "Reference 29" [ref=f15e626] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR29
                      - text: "29"
                  - text: . Peer-reviewed journal articles, including observational and interventional studies (randomized or non-randomized), published within the past 8 years (2017 onward) were considered for inclusion. This timeframe aligns with the introduction of transformer-based architectures that enabled the development of LLMs and, subsequently, Agentic AI systems
                  - superscript [ref=f15e627]:
                    - link "Reference 65" [ref=f15e628] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR65
                      - text: "65"
                    - text: ","
                    - link "Reference 66" [ref=f15e629] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR66
                      - text: "66"
                  - text: . Prior to this architectural shift, AI approaches in healthcare were predominantly rule-based or operated within fixed, predefined state spaces, lacking the autonomous operation, goal-directed behavior, and action-initiation capabilities that define Agentic AI. The emergence of transformer-based models provided contextual reasoning, multi-step planning, and tool-use capacities foundational to contemporary agentic systems
                  - superscript [ref=f15e630]:
                    - link "Reference 67" [ref=f15e631] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR67
                      - text: "67"
                  - text: . Therefore, restricting the search to 2017 onward ensured relevance to the modern paradigm of Agentic AI in healthcare
                  - superscript [ref=f15e632]:
                    - link "Reference 33" [ref=f15e633] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR33
                      - text: "33"
                    - text: ","
                    - link "Reference 68" [ref=f15e634] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR68
                      - text: "68"
                  - text: .
                - paragraph [ref=f15e635]:
                  - text: The rationale for selecting these three minimal criteria is grounded in both theoretical and practical considerations. Foundational models of agency emphasize autonomy and goal-directedness as the essential hallmarks distinguishing agents from static computational systems
                  - superscript [ref=f15e636]:
                    - link "Reference 4" [ref=f15e637] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR4
                      - text: "4"
                    - text: ","
                    - link "Reference 27" [ref=f15e638] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR27
                      - text: "27"
                  - text: . More recent surveys and governance frameworks extend this view by highlighting the importance of action initiation, specifically, the capacity to invoke external tools, APIs, or workflows, as the defining feature that moves systems beyond passive decision support toward active collaboration
                  - superscript [ref=f15e639]:
                    - link "Reference 6" [ref=f15e640] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR6
                      - text: "6"
                    - text: ","
                    - link "Reference 26" [ref=f15e641] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR26
                      - text: "26"
                  - text: ". From a clinical perspective, these criteria capture the minimal conditions required for an AI system to serve as a meaningful partner in healthcare: autonomy allows the system to operate independently in complex settings, goal-directedness ensures alignment with patient care objectives, and action initiation enables integration into real-world workflows where active interventions are essential. Together, they provide a necessary and sufficient baseline for distinguishing Agentic AI from traditional machine learning or rule-based systems."
                - paragraph [ref=f15e642]: Studies were excluded if they described traditional rule-based AI or machine learning systems lacking agentic properties (e.g., static prediction, data processing tasks). Research unrelated to healthcare or medical domains (e.g., applications in finance, education, or general robotics) was also excluded unless a clear clinical connection could be established. In vitro/animal studies, abstracts without full text, inaccessible full texts, expert opinions, reviews, comments, brief correspondence, short communication, personal viewpoints, opinions, technical notes, non-abstracts, preclinical studies, letters to editors, editorials, duplicate records, and published before 2017 were removed from consideration.
                - heading "Study screening" [level=3] [ref=f15e643]
                - paragraph [ref=f15e644]: "The literature search was conducted on April 15, 2025, across five databases accessible through the Mayo Clinic Library: PubMed, Embase, Cochrane, Scopus, and Google Scholar. Study screening and final inclusion were completed by April 29, 2025. Other databases, such as IEEE Xplore and ACM Digital Library, were not selected for screening because of the very low rate of studies with clear healthcare applications when this review was conducted."
                - paragraph [ref=f15e645]: "The complete search strategy included a combination of terms related to or similar to the following keywords: (“AI” OR “Machine Learning” OR AI OR LLM OR “LLMs” OR “GPT-4” OR “GPT-3” OR ChatGPT OR gemini OR Claude OR Bard OR Deepseek) AND (“Agentic AI” OR “autonomous AI” OR “AI agent” OR “AutoGPT” OR “Personal Assistant” OR “Research Agent” OR “multi-agent system” OR “workflow automation” OR “tool-using AI” OR “memory-enabled AI”) AND (“health care” OR healthcare OR medical OR clinical OR medicine OR “clinical decision” OR diagnosis OR intervention OR management OR patient OR “patient education”)."
                - paragraph [ref=f15e646]:
                  - text: Database-specific adaptations were applied, including MeSH terms for PubMed. More than 20,000 results were retrieved for Google Scholar, but only the first 100 were chosen for review using its relevance-based sorting. Although this approach may introduce selection bias, we adopted it transparently as it has been used in prior systematic reviews
                  - superscript [ref=f15e647]:
                    - link "69" [ref=f15e648] [cursor=pointer]:
                      - /url: "#ref-CR69"
                    - text: ","
                    - link "70" [ref=f15e649] [cursor=pointer]:
                      - /url: "#ref-CR70"
                    - text: ","
                    - link "71" [ref=f15e650] [cursor=pointer]:
                      - /url: "#ref-CR71"
                    - text: ","
                    - link "Reference 72" [ref=f15e651] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR72
                      - text: "72"
                  - text: . Google Scholar’s algorithm ranks results based on factors, such as full text availability, publication source, and citation counts, which we considered a practical compromise to balance relevance, manageability, and reproducibility.
                - paragraph [ref=f15e652]:
                  - text: Two independent reviewers (BC and SH) conducted the systematic search and all articles were imported into the EndNote software (version 21.3) to complete the screening
                  - superscript [ref=f15e653]:
                    - link "Reference 73" [ref=f15e654] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR73
                      - text: "73"
                  - text: . Minor disagreements were rapidly resolved through consensus, with a third author available when necessary (AG).
                - heading "Data extraction" [level=3] [ref=f15e655]
                - paragraph [ref=f15e656]: "Data from the included studies were manually extracted by one author (BC) and independently verified by a second author (SH). All reviewers followed a standardized Microsoft Excel sheet developed in advance to maintain consistency. Any uncertainties during the process were discussed collaboratively, with a third reviewer available to resolve disagreements (SP). Information gathered from each paper included: authors, publication year, country, study design, study domain, AI system name, main clinical task, key findings, features, and limitations."
                - heading "Risk of bias assessment" [level=3] [ref=f15e657]
                - paragraph [ref=f15e658]:
                  - text: Risk of bias was assessed independently by two reviewers (BC and SH). The ROBINS-I tool was used for non-randomized studies, reflecting the heterogeneous observational and experimental designs included
                  - superscript [ref=f15e659]:
                    - link "Reference 20" [ref=f15e660] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR20
                      - text: "20"
                  - text: . The RoB-2 tool was applied to the single randomized controlled trial
                  - superscript [ref=f15e661]:
                    - link "Reference 11" [ref=f15e662] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR11
                      - text: "11"
                  - text: due to its structured, domain-based approach
                  - superscript [ref=f15e663]:
                    - link "Reference 19" [ref=f15e664] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR19
                      - text: "19"
                  - text: . Disagreements were resolved by consensus with third-reviewer input (AG). Figures were generated using a web-based visualization tool
                  - superscript [ref=f15e665]:
                    - link "Reference 21" [ref=f15e666] [cursor=pointer]:
                      - /url: /articles/s41746-026-02517-5#ref-CR21
                      - text: "21"
                  - text: .
          - generic [ref=f15e667]:
            - generic [ref=f15e669]:
              - heading "Data Availability" [level=2] [ref=f15e670]
              - paragraph [ref=f15e672]: The data supporting the findings of this review are available within the article and its supplementary materials. Extracted information from the included studies is summarized in the main text and tables, and the standardized Excel extraction sheet used for data collection is provided as a supplementary file.
