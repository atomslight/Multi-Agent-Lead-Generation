                - strong [ref=f11e72]:
                  - emphasis [ref=f11e73]: •
                - text: AI Adoption barriers are easing today, with healthcare systems actively investing in agentic AI for measurable outcomes.
              - paragraph [ref=f11e74]: A patient encounter might be over, but the real grind begins after that.
              - paragraph [ref=f11e75]: Behind every encounter is a chain of tasks—coding, billing, validation, submission, follow-ups—each tied to different rules, systems, and stakeholders. What looks like a single interaction on the surface is actually a multi-step operational process running in the background.
              - paragraph [ref=f11e76]: At a small scale, manual intervention may work. But at large scale at which a health system typically operates in, it’s bound to break.
              - paragraph [ref=f11e77]:
                - text: Clinical data, imaging, claims, documentation—everything is growing faster than teams can process it. And at the same time, the system is running out of people. By 2030, healthcare is projected to face a
                - link "shortfall of 18 million workers" [ref=f11e78] [cursor=pointer]:
                  - /url: https://www.elgaronline.com/edcollchap/book/9781800886254/book-part-9781800886254-12.xml
                - text: globally.
              - paragraph [ref=f11e79]: When there aren’t enough people to keep up, the entire system slows down. Tasks get delayed, errors compound, and teams spend more time fixing issues than moving work forward.
              - paragraph [ref=f11e80]:
                - text: This is exactly where agentic AI becomes relevant in healthcare. And we’ll break down what
                - strong [ref=f11e81]: agentic AI in healthcare
                - text: actually means, how it differs from traditional and generative AI, and where it’s already being applied.
