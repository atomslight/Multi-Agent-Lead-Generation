                  - emphasis [ref=f11e65]: •
                - text: Healthcare workflows are breaking under scale—more data, fewer people, and growing operational complexity.
                - strong [ref=f11e66]:
                  - emphasis [ref=f11e67]: •
                - text: Agentic AI in healthcare shifts from assisting tasks to owning end-to-end workflows across clinical and administrative functions.
                - strong [ref=f11e68]:
                  - emphasis [ref=f11e69]: •
                - text: It enables real-time decision-making by combining data, planning actions, and adapting continuously.
                - strong [ref=f11e70]:
                  - emphasis [ref=f11e71]: •
