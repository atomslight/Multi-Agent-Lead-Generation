                - button "Expand table of contents" [ref=f11e144] [cursor=pointer]
              - heading "What is Agentic AI?" [level=2] [ref=f11e147]
              - paragraph [ref=f11e148]: Agentic AI represents a shift from “reactive” assistants (like standard chatbots) to “proactive” partners that can set goals, plan multi-step actions, and execute them with minimal human oversight.
              - paragraph [ref=f11e149]: Instead of waiting for instructions, these systems operate with intent.
              - paragraph [ref=f11e150]: You define the outcome, and the AI determines how to get there—breaking the task into steps, making decisions along the way, and adapting as conditions change.
              - heading "Agentic AI vs. Generative AI in Healthcare" [level=3] [ref=f11e151]
              - paragraph [ref=f11e152]: Unlike traditional and generative AI, which primarily respond to prompts or support discrete decisions, agentic AI can plan and sequence tasks, adapt to changing conditions, and coordinate across systems and people to deliver outcomes.
              - paragraph [ref=f11e153]: "Generative AI has already made a visible impact in healthcare with its ability to:"
              - list [ref=f11e154]:
                - listitem [ref=f11e155]:
                  - text: Summarize
                  - link "clinical notes" [ref=f11e156] [cursor=pointer]:
                    - /url: https://www.combinehealth.ai/blog/clinical-documentation-improvement-software
                - listitem [ref=f11e157]: Draft prior authorization letters
                - listitem [ref=f11e158]: Assist with documentation
                - listitem [ref=f11e159]: Answer patient or staff queries
              - paragraph [ref=f11e160]:
                - text: But its role is still largely
                - strong [ref=f11e161]: assistive and reactive
                - text: . It produces outputs when asked, but it doesn’t take action beyond that.
              - paragraph [ref=f11e162]: Agentic AI builds on these capabilities and extends them into execution.
              - paragraph [ref=f11e163]: "At a high level, the difference between Generative AI and Agentic AI comes down to this:"
              - table [ref=f11e165]:
                - rowgroup [ref=f11e166]:
                  - row [ref=f11e167]:
                    - cell [ref=f11e168]:
                      - paragraph [ref=f11e169]:
                        - strong [ref=f11e170]: Generative AI
                    - cell [ref=f11e171]:
                      - paragraph [ref=f11e172]:
                        - strong [ref=f11e173]: Agentic AI
                  - row [ref=f11e174]:
                    - cell [ref=f11e175]:
                      - paragraph [ref=f11e176]: Responds to prompts
                    - cell [ref=f11e177]:
                      - paragraph [ref=f11e178]: Acts toward goals
                  - row [ref=f11e179]:
                    - cell [ref=f11e180]:
                      - paragraph [ref=f11e181]: Generates content (text, code, summaries)
                    - cell [ref=f11e182]:
                      - paragraph [ref=f11e183]: Plans and executes workflows
                  - row [ref=f11e184]:
                    - cell [ref=f11e185]:
                      - paragraph [ref=f11e186]: Single-step outputs(e.g., structured report generation)
                    - cell [ref=f11e187]:
                      - paragraph [ref=f11e188]: Multi-step task orchestration via zero/few-shot learning
                  - row [ref=f11e189]:
