        - generic [ref=f11e196]:
          - paragraph [ref=f11e197]: Agentic AI in healthcare helps enterprises move from manual, fragmented workflows to autonomous execution across revenue cycle, clinical operations, and patient access.
          - heading "Key Takeaways" [level=2] [ref=f11e198]
          - list [ref=f11e199]:
            - listitem [level=1] [ref=f11e200]: Agentic AI in healthcare refers to the use of autonomous AI systems that perceive real-time clinical and operational signals, reason across EHR, claims, and payer data, and execute multi-step workflows across health systems without human intervention at each step
            - listitem [level=1] [ref=f11e201]: Generative AI summarizes and drafts for humans to act on, whereas agentic AI reasons across connected systems and executes end-to-end workflows autonomously within defined boundaries
            - listitem [level=1] [ref=f11e202]: The administrative and revenue cycle track delivers the fastest returns and is the right starting point; the clinical track requires a clinician in the loop at every patient-facing decision point
            - listitem [level=1] [ref=f11e203]: Highest-value entry points are prior authorization automation, denials management, patient access, and clinical documentation where decision volume exceeds what manual staffing can sustain
            - listitem [level=1] [ref=f11e204]: FHIR bidirectional integration is the prerequisite most deployment timelines underestimate; agents require real-time, two-way data access across EHR and claims systems to execute decisions reliably at scale
          - heading "What Is Agentic AI in Healthcare?" [level=2] [ref=f11e205]
          - paragraph [ref=f11e206]: Agentic AI in healthcare refers to autonomous AI systems that perceive real-time signals across EHR, claims, and payer systems, reason across clinical and administrative constraints, and execute decisions without human approval at each step.
          - paragraph [ref=f11e207]: "The distinction that matters most: generative AI summarized the prior authorization request. Agentic AI reads the clinical notes, pulls the payer policy, assembles the documentation package, submits the request, tracks authorization status, and escalates denials, without a staff member touching it."
          - paragraph [ref=f11e208]: Healthcare has been buried under administrative work for decades. Agentic AI is what finally closes the gap between clinical data and operational action.
          - paragraph [ref=f11e209]: "Below is how agentic AI compares to what healthcare organizations already have:"
          - table [ref=f11e210]:
            - rowgroup [ref=f11e211]:
              - row [ref=f11e212]:
