    - article [ref=f39e103]:
      - 'heading "Agentic AI: Navigating challenges, accelerating better health outcomes in healthcare and life sciences" [level=1] [ref=f39e107]'
      - generic [ref=f39e115]:
        - generic [ref=f39e116]:
          - generic [ref=f39e118]:
            - 'heading "Agentic AI: Another tech trend or an urgent imperative" [level=2] [ref=f39e119]'
            - paragraph [ref=f39e120]: Cost reduction is ranked as one of the key objectives among healthcare and life sciences organizations, followed by gaining a competitive edge or differentiation in the market. Hence, healthcare and life sciences organizations are focused on improving clinical or operational productivity with enhanced personalized experience.
            - paragraph [ref=f39e121]: Agentic AI is helping move organizations from passive insight to active, intelligent action, which is essential to streamline workflows, improve patient outcomes and drive innovation in a highly complex, regulated industry. With Agentic AI solutions, transformation leaders like Atos can help our customers reduce patient wait times by up to 30%, lessen claims denial rates by up to 40%, and reduce readmission rates by 20% to 30%.
            - paragraph [ref=f39e122]: "Agentic AI is powering change across the healthcare and life sciences sub-industries. Here’s how:"
            - list [ref=f39e123]:
              - listitem [ref=f39e124]:
                - strong [ref=f39e125]: Providers
                - text: ": Improved care coordination; reduced clinician burnout"
              - listitem [ref=f39e126]:
                - strong [ref=f39e127]: Payers
                - text: ": Enhanced claims processing; fraud detection"
              - listitem [ref=f39e128]:
                - strong [ref=f39e129]: Life Sciences (Pharma or Biotech)
                - text: ": Accelerated drug discovery; streamlined clinical trials"
              - listitem [ref=f39e130]:
                - strong [ref=f39e131]: MedTech
                - text: ": Proactive device servicing; intelligent diagnostics"
            - paragraph [ref=f39e132]: Although many global leaders are gearing towards an AI-powered infrastructure, they are still coming to terms with its potential, impact and the best course of action.
            - heading "Why Agentic AI struggles in production" [level=2] [ref=f39e133]
            - paragraph [ref=f39e134]: "Let’s explore some of the top 3 challenges faced in the AI adoption journey:"
            - list [ref=f39e135]:
              - listitem [ref=f39e136]: "Regulatory and compliance considerations: Every action taken by an AI agent must meet the same regulatory standards as a human-led process. That means clear audit trails, documented logic, and rigorous testing before deployment."
              - listitem [ref=f39e137]: "Ethical implications and governance: Autonomous agents and systems raise big questions around bias, explainability, and decision accountability. Healthcare and life sciences companies need strong governance frameworks to guide AI behavior, along with human oversight to catch what machines might miss."
              - listitem [ref=f39e138]: "Technical and operational hurdles: Legacy systems, siloed data, and lack of integration can slow AI adoption. Agentic AI works best when it can access clean, connected data and plug into existing workflows, so getting infrastructure AI-ready is a must."
            - heading "Supporting the Agentic AI journey" [level=2] [ref=f39e139]
            - paragraph [ref=f39e140]: As healthcare moves toward personalization, prevention, and predictive care, agentic AI will become a cornerstone capability.
            - paragraph [ref=f39e141]: Atos AI technology advisory helps in answering ‘Is agentic AI needed?’. Our teams have performed journey assessments and built future roadmaps that help in transformation and scaling with governance embedded within the AI factory model. Leveraging the Atos Agentic AI framework, we are enabling robust business outcomes and helping global leaders scale AI adoption across their organizational processes using pluggable AI Agents framework.
            - paragraph [ref=f39e142]:
              - strong [ref=f39e143]
            - paragraph [ref=f39e144]:
              - strong [ref=f39e145]: Atos Polaris platform
              - text: is a cloud-native, AI-driven digital platform designed to accelerate digital transformation for enterprises. It provides a unified environment for building, deploying, and managing data-driven applications and AI solutions for all our healthcare and life sciences customers.
            - paragraph [ref=f39e146]: "Powered by the Polaris platform for AI, Atos’s Agentic AI services acceleration framework can deliver business transformation solutions with 15-25% lower cost and improved speed of delivery. Some of the key features of this platform are given below:"
            - list [ref=f39e147]:
              - listitem [ref=f39e148]:
                - strong [ref=f39e149]: Hybrid and multi-cloud support
                - text: for seamless deployment
              - listitem [ref=f39e150]:
                - strong [ref=f39e151]: Advanced AI/ML and data orchestration
                - text: for real time insights
              - listitem [ref=f39e152]:
                - strong [ref=f39e153]: Modular microservices based architecture
                - text: for flexibility
              - listitem [ref=f39e154]:
                - strong [ref=f39e155]: Healthcare specific accelerators
                - text: ", aligned with regulatory needs"
              - listitem [ref=f39e156]:
                - strong [ref=f39e157]: Built in security and compliance
                - text: to protect sensitive PHI
              - listitem [ref=f39e158]:
                - strong [ref=f39e159]: Automation and orchestration
                - text: for intelligent workflows
            - heading "Leveraging partnerships as key enablers" [level=2] [ref=f39e160]
          - blockquote [ref=f39e167]:
            - paragraph [ref=f39e168]:
              - generic [ref=f39e169]: As in any transformation, Atos leverages its robust partnerships with leading platform providers like Salesforce, Nvidia, Microsoft, and Uipath to ensure clients can access world-class technology, customized for their business needs.
          - generic [ref=f39e184]:
            - heading "Trust, safety, and compliance" [level=2] [ref=f39e185]
            - paragraph [ref=f39e186]: AI’s ability to make autonomous decisions can be a double-edged sword. While it offers remarkable speed and accuracy, the black box nature of many AI models can make it difficult to understand how decisions are made. Atos ensures every AI-driven decision is safe, explainable, and compliant, empowering organizations to innovate without compromising patient well being or regulatory integrity.
            - heading "Built in data privacy and security" [level=3] [ref=f39e187]
            - paragraph [ref=f39e188]:
              - text: In healthcare, data protection is mission critical. Atos embeds
              - strong [ref=f39e189]: privacy-by-design
              - text: and
              - strong [ref=f39e190]: security-by-default
              - text: into every AI system. Encryption, anonymization, and secure data exchange protocols are foundational — not optional — ensuring sensitive health data remains safeguarded at every step and protected from exposure or misuse. All solutions are HIPAA- and GDPR-complaint and take into account local regulatory controls.
            - heading "Continuous monitoring and compliance oversight" [level=3] [ref=f39e191]
            - paragraph [ref=f39e192]:
              - text: Healthcare environments are highly regulated and dynamic. Atos provides
              - strong [ref=f39e193]: real time monitoring, automated audits, and continuous performance checks
              - text: to ensure AI systems operate safely, ethically, and in line with global regulatory standards. Feedback loops grounded in real world outcomes help the AI evolve responsibly and maintain clinical accuracy over time.
            - heading "Governance and human in the loop control" [level=3] [ref=f39e194]
            - paragraph [ref=f39e195]:
              - text: Autonomous systems must always remain within human authority. Atos integrates strong governance frameworks and
              - strong [ref=f39e196]: human in the loop (HITL)
              - text: controls, allowing clinicians and operators to review, override, or refine AI actions whenever needed. Clear accountability models, detailed audit trails, and robust cybersecurity ensure AI operates within well defined boundaries while enabling safer, smarter decision making.
            - heading "Four steps to choose and scale the right agentic AI use cases" [level=2] [ref=f39e197]
            - paragraph [ref=f39e198]:
              - text: As a Global Portfolio Lead at Atos, I would like to share a strategic, consulting led approach to help your organization adopt
              - strong [ref=f39e199]: Agentic AI with precision, purpose, and measurable impact
              - text: . Here are four steps that enable you to identify and deploy the right use cases that align with your enterprise architecture, operational priorities, and long term transformation goals.
            - paragraph [ref=f39e200]:
              - strong [ref=f39e201]: 1) Aligning to the business value chain
              - text: Focus on high impact workflows that directly influence
              - strong [ref=f39e202]: revenue, experience, and operational efficiency
              - text: — from patient and member onboarding to claims adjudication and contact center operations. By targeting processes that matter most, Atos delivers rapid ROI and enterprise wide value.
            - paragraph [ref=f39e203]:
              - strong [ref=f39e204]: 2) Persona driven experience design
              - text: Enhance the total experience by creating
              - strong [ref=f39e205]: data driven personas
              - text: across all stakeholder groups — patients, members, physicians, clinicians, agents, brokers, and more. With this offering, Atos ensures every AI agent is optimized to meet the unique needs, expectations, and behaviors of each user in the healthcare ecosystem.
            - paragraph [ref=f39e206]:
              - strong [ref=f39e207]: 3) Process agents for action oriented digital workflows
              - text: Consider designing AI agents that excel in
              - strong [ref=f39e208]: structured, screen based, digital tasks
              - text: across CRMs, ERPs, EMRs, portals, and web/native applications. Atos’s agents replicate high volume manual actions with speed, consistency, and accuracy, thereby freeing teams for higher value work.
            - paragraph [ref=f39e209]:
              - strong [ref=f39e210]: 4) SOP driven, high frequency automation
              - text: Clear, rule based processes with high transaction volumes are ideal for Agentic AI. The more structured the workflow, the faster AI learns and improves — unlocking
              - strong [ref=f39e211]: higher productivity, stronger outcomes, and superior ROI
              - text: ". Atos’s approach ensures AI is applied where it performs best: structured inputs, defined rules, and measurable results."
            - paragraph [ref=f39e212]: Atos is uniquely positioned to guide organizations on their AI journey, complete with domain depth, technology expertise, responsible AI leadership, robust partnerships and the unparalleled Polaris platform.
          - blockquote [ref=f39e219]:
            - paragraph [ref=f39e220]:
              - generic [ref=f39e221]: We don’t just deploy AI. We build the intelligent, secure, and ethical foundation for the healthcare systems of tomorrow.
          - generic [ref=f39e236]:
            - separator [ref=f39e237]
